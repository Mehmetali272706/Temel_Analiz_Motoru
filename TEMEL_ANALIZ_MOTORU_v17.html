function FundamentalAnalysis() {
  const [data, setData] = useState(initialData);
  const [uploadMsg, setUploadMsg] = useState('');
  const [activeTab, setActiveTab] = useState('analiz'); // 'analiz' | 'sade' | 'egitim' — v16: paneller arası buton geçişi
  const handleChange = (name, value) => setData(d => ({...d, [name]: value}));
  const r = useMemo(() => computeRatios(data), [data]);
  const sectorKey = data.sector || 'sanayi';
  const reset = () => { setData(initialData); setUploadMsg(''); };

  // Excel yükleme — mode: 'quarterly' veya 'annual'. İlgili depoya (quarterlyStore / annualStore) yazar, üstüne yazmaz, biriktirir.
  const handleExcelUpload = (event, mode) => {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;
    const effMode = mode || 'quarterly';
    const sortKeyFn = effMode === 'annual' ? annualSortKey : periodSortKey;
    let combined = {}; // {field: {periodLabel: value}}
    let allPeriods = new Set();
    let detectedTicker = null;

    const readFile = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          if (!ws) { resolve(null); return; }
          const result = parseInvestingSheet(ws, effMode);
          if (!result) { resolve(null); return; }
          const fname = file.name.replace(/\.(xlsx|xls)$/i, '');
          const m = fname.match(/^([A-Z0-9]{3,8})/i);
          if (m && !detectedTicker) detectedTicker = m[1].toUpperCase();
          for (const [field, periodVals] of Object.entries(result.data)) {
            if (!combined[field]) combined[field] = {};
            Object.assign(combined[field], periodVals);
          }
          result.periods.forEach(p => allPeriods.add(p));
          resolve(true);
        } catch(err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('Okunamadı: ' + file.name));
      reader.readAsArrayBuffer(file);
    });

    Promise.all(files.map(readFile)).then(() => {
      if (!Object.keys(combined).length) {
        setUploadMsg('❌ Tanınan kalem bulunamadı. Investing.com formatında olduğundan emin ol.');
        return;
      }
      const v = (field, period) => {
        const pv = combined[field];
        return (pv && pv[period] !== undefined) ? pv[period] : null;
      };

      const storeKey = effMode === 'annual' ? 'annualStore' : 'quarterlyStore';
      // Her dönem için, o döneme ait tüm ham kalemleri ilgili depoya yaz (var olanın üstüne ekle/güncelle)
      const newStore = {...data[storeKey]};
      const periodsSorted = Array.from(allPeriods).sort((a,b) => sortKeyFn(b) - sortKeyFn(a));

      for (const period of periodsSorted) {
        const rec = {...(newStore[period] || {})};
        QUARTERLY_FIELDS.forEach(f => { const val = v(f, period); if (val !== null) rec[f] = val; });
        if (rec.netIncome === undefined || rec.netIncome === null) {
          const ni = v('netIncomeTotal', period);
          if (ni !== null) rec.netIncome = ni;
        }
        const ie = v('interestExpense', period);
        if (ie !== null) rec.interestExpense = Math.abs(ie);
        const cx = v('capex', period);
        if (cx !== null) rec.capex = Math.abs(cx);
        const stdRaw = v('shortTermDebtRaw', period);
        const ltdCurr = v('longTermDebtCurrentPortion', period);
        if (stdRaw !== null || ltdCurr !== null) rec.shortTermDebt = (stdRaw || 0) + (ltdCurr || 0);
        const sh = v('sharesOutstanding', period);
        if (sh !== null && sh > 0) rec.sharesOutstanding = sh;
        newStore[period] = rec;
      }

      const newestPeriod = periodsSorted[0];
      setData(d => {
        const merged = {...d, [storeKey]: newStore, dataMode: effMode};
        if (detectedTicker && !d.ticker) merged.ticker = detectedTicker;
        return applyPeriodToData(merged, newestPeriod || d.activePeriod, effMode);
      });
      const modeLabel = effMode === 'annual' ? 'Yıllık' : 'Çeyreklik';
      setUploadMsg('✅ ' + modeLabel + ' yüklendi: ' + (detectedTicker || data.ticker || '?') + ' — ' + periodsSorted.slice(0,4).join(', ') + (periodsSorted.length>4?' ...':'') + '. Fiyat, Sektör ve bayrakları gir.');
    }).catch(err => {
      setUploadMsg('❌ Hata: ' + err.message);
    });
    event.target.value = '';
  };

  // v17: Fintables yükleme — tek dosya (7 sayfalı workbook) hem çeyreklik hem yıllık depoyu
  // aynı anda doldurur, ayrı "Çeyreklik/Yıllık" modu seçmeye gerek yok. Tek seferde TEK şirket
  // işlenir — aynı yüklemede birden fazla farklı hisse kodu bulunursa sadece ilki (alfabetik)
  // işlenir, gerisi atlanır (şirketleri karıştırmamak için). Zaten yüklü bir şirket varken farklı
  // bir hisse yüklenmeye çalışılırsa reddedilir — önce "Sıfırla" gerekir.
  const handleFintablesUpload = (event) => {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;

    const readFile = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, {type:'array'});
          const result = parseFintablesWorkbook(wb);
          const fname = file.name.replace(/\.(xlsx|xls)$/i, '');
          const mm = fname.match(/^([A-Z0-9]{3,8})/i);
          resolve({ ticker: mm ? mm[1].toUpperCase() : null, result });
        } catch(err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('Okunamadı: ' + file.name));
      reader.readAsArrayBuffer(file);
    });

    Promise.all(files.map(readFile)).then((outs) => {
      const byTicker = {};
      outs.forEach(o => { if (o.ticker && !byTicker[o.ticker]) byTicker[o.ticker] = o.result; });
      const allTickers = Object.keys(byTicker).sort();
      if (!allTickers.length) { setUploadMsg('❌ Dosya adından hisse kodu tanınamadı.'); event.target.value=''; return; }

      const chosen = allTickers[0];
      const extraSkipped = allTickers.slice(1);
      const result = byTicker[chosen];

      if (!result || result.error === 'sheets_missing') {
        setUploadMsg('❌ ' + chosen + ': beklenen sayfalar (Bilanço / Gelir Tablosu / Nakit Akış) bulunamadı — dosyanın Fintables formatında olduğundan emin ol.');
        event.target.value=''; return;
      }
      if (result.error === 'bank_format') {
        setUploadMsg('⚠️ ' + chosen + ': banka formatı tespit edildi — Fintables entegrasyonu şu an sadece banka-dışı şirketleri destekliyor.');
        event.target.value=''; return;
      }

      let blockedBy = null;
      setData(d => {
        const hasExisting = d.ticker && Object.keys(d.quarterlyStore || {}).length > 0;
        if (hasExisting && d.ticker !== chosen) { blockedBy = d.ticker; return d; }
        const quarterlyStore = {...d.quarterlyStore};
        const annualStore = {...d.annualStore};
        Object.entries(result.quarterlyRecords).forEach(([label, rec]) => { quarterlyStore[label] = {...(quarterlyStore[label]||{}), ...rec}; });
        Object.entries(result.annualRecords).forEach(([label, rec]) => { annualStore[label] = {...(annualStore[label]||{}), ...rec}; });
        const merged = {...d, quarterlyStore, annualStore, ticker: d.ticker || chosen, dataMode:'quarterly'};
        const periods = Object.keys(quarterlyStore).sort((a,b) => periodSortKey(b)-periodSortKey(a));
        return applyPeriodToData(merged, periods[0] || d.activePeriod, 'quarterly');
      });

      if (blockedBy) {
        setUploadMsg('⚠️ Şu an ' + blockedBy + ' yüklü — farklı şirket (' + chosen + ') yüklemek için önce "Sıfırla" ya bas.');
      } else {
        let msg = '✅ Fintables yüklendi: ' + chosen + '.';
        if (extraSkipped.length) msg += ' Aynı yüklemede bulunan diğer şirketler atlandı (tek seferde tek şirket): ' + extraSkipped.join(', ') + '.';
        setUploadMsg(msg);
      }
    }).catch(err => setUploadMsg('❌ Hata: ' + err.message));
    event.target.value = '';
  };

  // Aktif dönemi değiştirme (seçici üzerinden) — mevcut dataMode'a göre ilgili depodan okur
  const handlePeriodSelect = (period) => {
    setData(d => applyPeriodToData(d, period, d.dataMode));
  };

  // v16: Görüntüleme modu değiştirme — "Çeyreklik Görünüm" / "Yıllık Görünüm" butonları
  // Sadece hangi depoyu gösterdiğimizi değiştirir, veriyi silmez. İlgili depoda dönem yoksa
  // aktif dönem boşalır (Excel yüklenmeyi bekler).
  const handleModeSwitch = (mode) => {
    setData(d => {
      const store = mode === 'annual' ? (d.annualStore || {}) : (d.quarterlyStore || {});
      const sortKeyFn = mode === 'annual' ? annualSortKey : periodSortKey;
      const periods = Object.keys(store).sort((a,b) => sortKeyFn(b) - sortKeyFn(a));
      const newest = periods[0] || '';
      if (!newest) return {...d, dataMode: mode, activePeriod: '', period: ''};
      return applyPeriodToData({...d, dataMode: mode}, newest, mode);
    });
  };

  // Trend hesaplama — aktif dataMode'a göre quarterlyStore veya annualStore'dan dönemleri alır.
  // Sabit sayı (8 çeyrek / N yıl) hedeflemez; depoda kaç dönem varsa onu gösterir.
  const trends = useMemo(() => {
    const isAnnual = data.dataMode === 'annual';
    const store = isAnnual ? (data.annualStore || {}) : (data.quarterlyStore || {});
    const sortKeyFn = isAnnual ? annualSortKey : periodSortKey;
    const allPeriods = Object.keys(store).sort((a,b) => sortKeyFn(b) - sortKeyFn(a));
    if (allPeriods.length < 2) return null;
    // Çeyreklikte tarihsel olarak "son 8" sınırı vardı (Investing.com kısıtı); yıllıkta depoda ne varsa onu al.
    const last = isAnnual ? allPeriods : allPeriods.slice(0, 8);
    const cm = (rec) => rec && rec.revenue ? {
      gross: rec.grossProfit ? rec.grossProfit / rec.revenue : null,
      operating: rec.operatingProfit ? rec.operatingProfit / rec.revenue : null,
      ebitda: rec.ebitda ? rec.ebitda / rec.revenue : null,
      net: rec.netIncome ? rec.netIncome / rec.revenue : null,
    } : null;
    return {
      hasData: true,
      isAnnual,
      periods: last,
      revenues: last.map(p => store[p].revenue ?? null),
      netIncomes: last.map(p => store[p].netIncome ?? null),
      margins: last.map(p => cm(store[p])),
    };
  }, [data.quarterlyStore, data.annualStore, data.dataMode]);

  // Hızlı eleme
  const quickFilter = useMemo(() => {
    const equityVal = num(data.equity);
    const items = [
      {key:'netIncome', label:'Net Kâr', neg: r.netIncome !== null && r.netIncome < 0, value: r.netIncome, present: r.netIncome !== null},
      {key:'equity', label:'Özkaynak', neg: equityVal !== null && equityVal < 0, value: equityVal, present: equityVal !== null},
      {key:'fcf', label:'Serbest Nakit Akışı', neg: r.freeCashFlow !== null && r.freeCashFlow < 0, value: r.freeCashFlow, present: r.freeCashFlow !== null},
    ];
    const present = items.filter(i => i.present);
    return {items, present, negCount: present.filter(i=>i.neg).length, presentCount: present.length};
  }, [r, data.equity]);

  // Status sayaçları
  const statusCounts = useMemo(() => {
    const counts = {excellent:0, good:0, weak:0, dangerous:0, na:0};
    const imp = r.implausible || {};
    const lq = r.lowQualityEarnings;
    const add = (s) => { if (counts[s] !== undefined) counts[s]++; };
    const addR = (id, s) => add(imp[id] ? 'na' : s);
    add(secEval('grossMargin', r.grossMargin, sectorKey));
    add(secEval('operatingMargin', r.operatingMargin, sectorKey));
    add(secEval('ebitdaMargin', r.ebitdaMargin, sectorKey));
    add((lq || r.marginAnomaly) ? (secEval('netMargin', r.netMargin, sectorKey) === 'na' ? 'na' : 'dangerous') : secEval('netMargin', r.netMargin, sectorKey));
    add(lq ? 'dangerous' : secEval('roe', r.roe, sectorKey));
    add(lq ? 'dangerous' : secEval('roa', r.roa, sectorKey));
    add(lq ? 'dangerous' : secEval('roic', r.roic, sectorKey));
    add(secEval('currentRatio', r.currentRatio, sectorKey));
    add(secEval('quickRatio', r.quickRatio, sectorKey));
    add(secEval('cashRatio', r.cashRatio, sectorKey));
    add(secEval('debtToEquity', r.debtToEquity, sectorKey));
    add(secEval('debtToAssets', r.debtToAssets, sectorKey));
    add(secEval('equityRatio', r.equityRatio, sectorKey));
    addR('netDebtToEbitda', secEval('netDebtToEbitda', r.netDebtToEbitda, sectorKey));
    add(secEval('interestCoverage', r.interestCoverage, sectorKey));
    add(data.isReit ? 'na' : secEval('assetTurnover', r.assetTurnover, sectorKey));
    add(data.isReit ? 'na' : secEval('inventoryTurnover', r.inventoryTurnover, sectorKey));
    addR('peRatio', secEval('peRatio', r.peRatio, sectorKey));
    addR('pbRatio', secEval('pbRatio', r.pbRatio, sectorKey));
    addR('evEbitda', secEval('evEbitda', r.evEbitda, sectorKey));
    add(secEval('psRatio', r.psRatio, sectorKey));
    add(r.fcfNegative ? 'dangerous' : secEval('pFcf', r.pFcf, sectorKey));
    add(secEval('revenueGrowth', r.revenueGrowth, sectorKey));
    add(secEval('netIncomeGrowth', r.netIncomeGrowth, sectorKey));
    add(secEval('cashFlowToNetIncome', r.cashFlowToNetIncome, sectorKey));
    add(r.freeCashFlow !== null ? (r.freeCashFlow > 0 ? 'good' : 'dangerous') : 'na');
    add(secEval('receivableVsSalesGap', r.receivableVsSalesGap, sectorKey));
    add(data.isReit ? 'na' : secEval('inventoryVsSalesGap', r.inventoryVsSalesGap, sectorKey));
    return counts;
  }, [r, data, sectorKey]);

  const totalEvaluated = statusCounts.excellent + statusCounts.good + statusCounts.weak + statusCounts.dangerous;
  const negativeCount = statusCounts.weak + statusCounts.dangerous;
  const negativeRatio = totalEvaluated > 0 ? negativeCount / totalEvaluated : 0;

  // Verdict
  const V_CORE  = {text:'CORE',  color:'#4ade80', bg:'rgba(74,222,128,0.12)', detail:'Çoğu metrik eşiği karşılıyor — core kalitesi var. MAB-5 sinyaliyle zamanlama belirle.'};
  const V_IZLE  = {text:'İZLE',  color:'#fbbf24', bg:'rgba(251,191,36,0.12)',  detail:'Karma tablo: bazı kalemler eşiği karşılamıyor. Trade olarak değerlendirilebilir.'};
  const V_BEKLE = {text:'BİLANÇO-BEKLE', color:'#f87171', bg:'rgba(248,113,113,0.12)', detail:'Metriklerin çoğu eşiği karşılamıyor — fundamental destek yok. Bir sonraki bilançoda yeniden bak.'};

  let verdict = null;
  let knockoutReason = null;
  let valuationDanger = 0;
  if (totalEvaluated >= 10) {
    const paperEarnings = r.marginAnomaly && r.cashFlowToNetIncome !== null && r.cashFlowToNetIncome < 1;
    const finSectV = sectorKey === 'holding' || sectorKey === 'yatirim';
    const holdingSignFail = finSectV && r.lowQualityEarnings;
    const holdingCashBurn = finSectV && r.cashFlowToNetIncome !== null && r.cashFlowToNetIncome < 0;
    const ebitdaNeg = r.ebitdaPositive === false && r.ebitda !== null;
    const liqFail = r.currentRatio !== null && r.currentRatio < 1.0 && r.interestCoverage !== null && r.interestCoverage < 0;
    if (paperEarnings) knockoutReason = 'Kâğıt kâr';
    else if (holdingSignFail) knockoutReason = 'Holding kâğıt kâr';
    else if (holdingCashBurn) knockoutReason = 'Holding nakit yakıyor';
    else if (ebitdaNeg) knockoutReason = 'FAVÖK negatif';
    else if (liqFail) knockoutReason = 'Likidite + ödeme gücü riski';

    valuationDanger = ['peRatio','pbRatio','evEbitda','psRatio']
      .filter(id => !(r.implausible && r.implausible[id]) && secEval(id, r[id], sectorKey) === 'dangerous').length
      + (r.fcfNegative ? 1 : (secEval('pFcf', r.pFcf, sectorKey) === 'dangerous' ? 1 : 0));

    if (knockoutReason) {
      verdict = {...V_BEKLE};
    } else {
      if (negativeRatio > 0.55) verdict = {...V_BEKLE};
      else if (negativeRatio >= 0.35) verdict = {...V_IZLE};
      else verdict = {...V_CORE};
      if (verdict.text === 'CORE' && valuationDanger >= 3) {
        verdict = {...V_IZLE};
        verdict.detail = 'Bilanço sağlam ama ' + valuationDanger + ' değerleme metriği tehlike bölgesinde. Kaliteli şirket ≠ ucuz hisse.';
      }
    }
  }

  // MAB-5 entegrasyonu
  const mab5 = (() => {
    const sig = data.mab5Signal;
    if (!sig) return null;
    const maxPos = parseFloat(data.maxPosition) || 25;
    const healthy = verdict && verdict.text === 'CORE';
    const risky = verdict && verdict.text === 'BİLANÇO-BEKLE';
    const stGun = data.pnlStGun === '' ? null : parseInt(data.pnlStGun, 10);
    const timingWarn = [];
    if (data.pnlUyari === 'uyari') timingWarn.push('Günlük UYARI aktif');
    if (data.pnlObv === 'dagitim') timingWarn.push('OBV=DAĞITIM (hacim baskısı)');
    if (stGun !== null && stGun <= 1) timingWarn.push('ST ' + stGun + ' gün (teyitsiz)');
    const tw = timingWarn.length ? ' ⚠ ' + timingWarn.join(' + ') : '';
    if (sig === 'cik') return {title:'ÇIKIŞ / pozisyon alma', detail:'ÇIK sinyali — yeni pozisyon yok; açık pozisyonda çıkış kuralını uygula.'};
    if (sig === 'tut') return {title:'TUT — açık pozisyonu koru', detail:'TUT: stop/kâr-kilidi kurallarını uygula.' + tw};
    if (sig === 'bekle') return {title:'POZİSYON AÇMA — BEKLE', detail:'Zamanlama yok; sinyal bekle.' + tw};
    if (sig === 'aday') return {title:'ADAY — sadece izle', detail:'İzleme havuzunda, giriş yok.' + tw};
    if (sig === 'radar') return {title:'RADAR — hazırlan, henüz girme', detail:'AL etiketine dönerse gir.' + tw};
    if (sig === 'hazir') return {title:'HAZIR — bekle, bu AL değil', detail:(healthy ? 'Koşullar olgun ama etiket AL basmadı.' : 'Hazır ama temel karma — tetik yok + core yok = girme.') + tw};
    // AL
    const lo = Math.round(maxPos*0.4), hi = Math.round(maxPos*0.6);
    if (healthy) return {title:'AL — tam pozisyon (~%' + maxPos + ')', detail:'AL + sağlam temel + tam pozisyon savunulabilir.' + tw};
    if (risky) return {title:'AL var ama trade — core değil; küçük + sıkı stoplu', detail:'Temel zayıf. Yalnızca trade.' + tw};
    return {title:'AL — azaltılmış pozisyon (~%' + lo + '–' + hi + ')', detail:'Karma temel. MAB-5 AL ama % küçük tut.' + tw};
  })();

  const headlineLabel = verdict ? verdict.text : 'NET ETİKET YOK';

  // ── ÖZET KUTUSU: Güçlü/Zayıf yönler (ilk 30 saniyede ne görürdüm mantığı) ──
  const buildStrengthsWeaknesses = () => {
    const items = [];
    const pushIf = (cond, label, isGood) => { if (cond) items.push({label, good:isGood}); };

    pushIf(r.revenueGrowth !== null, 'Hasılat ' + (r.revenueGrowth >= 0 ? 'büyüyor' : 'düşüyor') + ' (' + fmt(r.revenueGrowth,{pct:true}) + ')', r.revenueGrowth !== null && r.revenueGrowth > 0.05);
    pushIf(r.netIncomeGrowth !== null, 'Net kâr ' + (r.netIncomeGrowth >= 0 ? 'büyüyor' : 'düşüyor') + ' (' + fmt(r.netIncomeGrowth,{pct:true}) + ')', r.netIncomeGrowth !== null && r.netIncomeGrowth > 0);
    pushIf(r.netIncome !== null, 'Net kâr ' + (r.netIncome >= 0 ? 'pozitif' : 'negatif'), r.netIncome !== null && r.netIncome > 0);
    pushIf(r.grossMargin !== null && r.netMargin !== null, 'Brüt kâr marjı ' + fmt(r.grossMargin,{pct:true}), secEval('grossMargin', r.grossMargin, sectorKey) === 'excellent' || secEval('grossMargin', r.grossMargin, sectorKey) === 'good');
    pushIf(r.cashFlowToNetIncome !== null, 'Nakit/Net Kâr oranı ' + fmt(r.cashFlowToNetIncome), r.cashFlowToNetIncome !== null && r.cashFlowToNetIncome >= 0.9);
    pushIf(r.freeCashFlow !== null, 'Serbest nakit akışı ' + (r.freeCashFlow >= 0 ? 'pozitif' : 'negatif'), r.freeCashFlow !== null && r.freeCashFlow > 0);
    pushIf(r.receivableVsSalesGap !== null, 'Alacaklar ' + (r.receivableVsSalesGap > 0.10 ? 'satıştan hızlı büyüyor' : 'satışla uyumlu büyüyor'), r.receivableVsSalesGap !== null && r.receivableVsSalesGap <= 0.10);
    pushIf(r.inventoryVsSalesGap !== null && !data.isReit, 'Stoklar ' + (r.inventoryVsSalesGap > 0.10 ? 'satıştan hızlı büyüyor' : 'kontrol altında'), r.inventoryVsSalesGap !== null && r.inventoryVsSalesGap <= 0.10);
    pushIf(r.netDebtToEbitda !== null && r.ebitdaPositive, 'Net Borç/FAVÖK ' + fmt(r.netDebtToEbitda) + 'x', r.netDebtToEbitda !== null && r.netDebtToEbitda <= 3.0);
    pushIf(!r.ebitdaPositive && r.ebitda !== null, 'FAVÖK negatif', false);
    pushIf(r.currentRatio !== null, 'Cari oran ' + fmt(r.currentRatio), r.currentRatio !== null && r.currentRatio >= 1.5);
    pushIf(r.equityRatio !== null, 'Özkaynak oranı ' + fmt(r.equityRatio,{pct:true}), r.equityRatio !== null && r.equityRatio >= 0.35);
    pushIf(r.roe !== null, 'ROE ' + fmt(r.roe,{pct:true}), r.lowQualityEarnings ? false : (r.roe !== null && r.roe >= 0.20));
    pushIf(valuationDanger > 0, valuationDanger + ' değerleme metriği tehlike bölgesinde (fiyat pahalı olabilir)', false);

    const good = items.filter(i => i.good).map(i => i.label);
    const bad = items.filter(i => !i.good).map(i => i.label);
    return {good, bad};
  };

  // ── Word raporu (gerçek .docx — OOXML, sıfır bağımlılık) ──

  // XML için güvenli kaçış
  const xmlEsc = (s) => String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');

  // ---- Minimal ZIP (store/sıkıştırmasız) + docx paketleyici ----
  const buildDocxBytes = (paragraphsXml) => {
    const strToUtf8Bytes = (str) => new TextEncoder().encode(str);

    const crc32 = (bytes) => {
      let table = window.__crc32table;
      if (!table) {
        table = window.__crc32table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          table[n] = c;
        }
      }
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
      return (crc ^ 0xFFFFFFFF) >>> 0;
    };

    const wU32 = (arr, off, val) => { arr[off]=val&0xFF; arr[off+1]=(val>>>8)&0xFF; arr[off+2]=(val>>>16)&0xFF; arr[off+3]=(val>>>24)&0xFF; };
    const wU16 = (arr, off, val) => { arr[off]=val&0xFF; arr[off+1]=(val>>>8)&0xFF; };

    const makeZip = (files) => {
      const localChunks = [], centralChunks = [];
      let offset = 0;
      const dosTime = 0, dosDate = 0x21;

      for (const f of files) {
        const nameBytes = strToUtf8Bytes(f.name);
        const data = f.data;
        const crc = crc32(data);
        const size = data.length;

        const lh = new Uint8Array(30);
        wU32(lh,0,0x04034b50); wU16(lh,4,20); wU16(lh,6,0); wU16(lh,8,0);
        wU16(lh,10,dosTime); wU16(lh,12,dosDate); wU32(lh,14,crc);
        wU32(lh,18,size); wU32(lh,22,size); wU16(lh,26,nameBytes.length); wU16(lh,28,0);
        localChunks.push(lh, nameBytes, data);

        const ch = new Uint8Array(46);
        wU32(ch,0,0x02014b50); wU16(ch,4,20); wU16(ch,6,20); wU16(ch,8,0); wU16(ch,10,0);
        wU16(ch,12,dosTime); wU16(ch,14,dosDate); wU32(ch,16,crc);
        wU32(ch,20,size); wU32(ch,24,size); wU16(ch,28,nameBytes.length);
        wU16(ch,30,0); wU16(ch,32,0); wU16(ch,34,0); wU16(ch,36,0); wU32(ch,38,0); wU32(ch,42,offset);
        centralChunks.push(ch, nameBytes);

        offset += lh.length + nameBytes.length + data.length;
      }

      const centralSize = centralChunks.reduce((a,b) => a+b.length, 0);
      const centralOffset = offset;
      const end = new Uint8Array(22);
      wU32(end,0,0x06054b50); wU16(end,4,0); wU16(end,6,0);
      wU16(end,8,files.length); wU16(end,10,files.length);
      wU32(end,12,centralSize); wU32(end,16,centralOffset); wU16(end,20,0);

      const all = [...localChunks, ...centralChunks, end];
      const total = all.reduce((a,b) => a+b.length, 0);
      const out = new Uint8Array(total);
      let pos = 0;
      for (const c of all) { out.set(c, pos); pos += c.length; }
      return out;
    };

    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:body>' + paragraphsXml +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>' +
      '</w:body></w:document>';

    return makeZip([
      { name: '[Content_Types].xml', data: strToUtf8Bytes(contentTypes) },
      { name: '_rels/.rels', data: strToUtf8Bytes(rootRels) },
      { name: 'word/document.xml', data: strToUtf8Bytes(documentXml) },
    ]);
  };

  // ---- Paragraf yardımcıları (sade biçim: kalın başlık + düz satırlar) ----
  const pHeading = (text, sz) =>
    '<w:p><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="' + (sz||28) + '"/></w:rPr><w:t xml:space="preserve">' + xmlEsc(text) + '</w:t></w:r></w:p>';

  const pPlain = (text, opts={}) => {
    const rpr = opts.bold ? '<w:rPr><w:b/></w:rPr>' : '';
    const spc = '<w:pPr><w:spacing w:after="' + (opts.after !== undefined ? opts.after : 40) + '"/></w:pPr>';
    return '<w:p>' + spc + '<w:r>' + rpr + '<w:t xml:space="preserve">' + xmlEsc(text) + '</w:t></w:r></w:p>';
  };

  // Etiket + değer + durum tek satırda, sekme ile hizalı (tablosuz, sade)
  const pRow = (label, val, status, opts={}) => {
    const sLabels = {excellent:'Güçlü', good:'İyi', weak:'Zayıf', dangerous:'Tehlike', na:'Veri yok', suspect:'Şüpheli'};
    const statusText = sLabels[status] || sLabels.na;
    const line = label + ':  ' + fmt(val, opts) + '   [' + statusText + ']';
    let out = pPlain(line, {after: (opts.ratioId || opts.note) ? 0 : 40});
    if (opts.ratioId && RATIO_EXPLAIN[opts.ratioId]) {
      out += '<w:p><w:pPr><w:spacing w:after="80"/><w:ind w:left="200"/></w:pPr><w:r><w:rPr><w:i/><w:color w:val="767676"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">' + xmlEsc(RATIO_EXPLAIN[opts.ratioId]) + '</w:t></w:r></w:p>';
    }
    if (opts.note) {
      out += '<w:p><w:pPr><w:spacing w:after="80"/><w:ind w:left="200"/></w:pPr><w:r><w:rPr><w:i/><w:color w:val="b45309"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">⚠ ' + xmlEsc(opts.note) + '</w:t></w:r></w:p>';
    }
    return out;
  };

  // ── Kural bazlı açıklayıcı yorum: ne / neden / olası sonuç ──
  const buildVerdictNarrative = () => {
    if (!verdict) return null;
    const flags = buildQualityFlags(r, data, sectorKey);
    const highFlags = flags.filter(f => f.sev === 'high');
    const medFlags = flags.filter(f => f.sev === 'medium');

    // NE: kısa tanım
    const neMap = {
      'CORE': 'Şirket, değerlendirilen metriklerin çoğunda sektör eşiklerini karşılıyor; bilanço tarafında ciddi bir uyarı işareti yok.',
      'İZLE': 'Tablo karma — bazı metrikler iyi, bazıları eşiğin altında. Net bir bilanço kalitesi hükmü çıkmıyor.',
      'BİLANÇO-BEKLE': 'Değerlendirilen metriklerin çoğu sektör eşiğinin altında kalıyor; bilanço şu an fundamental destek sağlamıyor.',
    };
    const ne = neMap[verdict.text] || verdict.detail;

    // NEDEN: knockout + en kritik bayraklar + negatif oran
    let nedenParts = [];
    if (knockoutReason) {
      nedenParts.push('Doğrudan etkili neden: ' + knockoutReason + '. Bu durum tek başına BİLANÇO-BEKLE kararını tetikliyor, çünkü kazancın kalitesi veya ödeme gücü temel olarak sorgulanıyor.');
    }
    if (highFlags.length > 0) {
      nedenParts.push('Kritik bulgular: ' + highFlags.map(f => f.title).join('; ') + '.');
    }
    if (medFlags.length > 0) {
      nedenParts.push('Dikkat edilmesi gereken noktalar: ' + medFlags.map(f => f.title).join('; ') + '.');
    }
    nedenParts.push('Genel tablo: ' + negativeCount + '/' + totalEvaluated + ' metrik (%' + Math.round(negativeRatio*100) + ') zayıf veya tehlike bölgesinde.');
    if (!knockoutReason && valuationDanger >= 3) {
      nedenParts.push('Ayrıca ' + valuationDanger + ' değerleme metriği (F/K, PD/DD, EV/FAVÖK, F/S, PD/FCF arasından) tehlike bölgesinde — bilanço sağlam olsa bile fiyat pahalı olabilir.');
    }
    const neden = nedenParts.join(' ');

    // OLASI SONUÇ: verdict tipine göre kural bazlı projeksiyon
    let sonuc;
    if (verdict.text === 'BİLANÇO-BEKLE') {
      sonuc = 'Mevcut veriyle pozisyon açmak fundamental açıdan savunulabilir değil. MAB-5 teknik sinyali AL verse bile, bu sinyal yalnızca küçük/sıkı stoplu bir trade olarak ele alınmalı — core pozisyon için bir sonraki bilanço döneminde tabloyu yeniden değerlendirmek gerekir. Knockout nedeni ortadan kalkmadan (örn. kazanç kalitesi düzelmeden, FAVÖK pozitife dönmeden) hüküm değişmez.';
    } else if (verdict.text === 'İZLE') {
      sonuc = 'Şirket ne net bir core adayı ne de net bir red. Karma tablo, pozisyonun trade mantığıyla ve daha küçük büyüklükte ele alınmasını gerektirir. Zayıf kalan metriklerin bir sonraki dönemde iyileşip iyileşmediği, hükmü CORE veya BİLANÇO-BEKLE yönüne kaydırabilir.';
    } else if (verdict.text === 'CORE') {
      if (valuationDanger >= 3) {
        sonuc = 'Bilanço kalitesi core seviyesinde, ancak fiyat/değerleme tarafı pahalı bölgede. Bu kombinasyon "kaliteli şirket, kötü zamanlanmış giriş" riski taşır — pozisyon büyüklüğü ve giriş zamanlaması MAB-5 sinyaliyle daha sıkı eşleştirilmeli.';
      } else {
        sonuc = 'Bilanço tarafı core pozisyon için gerekli desteği sağlıyor. Giriş zamanlaması ve pozisyon büyüklüğü MAB-5 teknik sinyaline bırakılabilir; fundamental tarafta ek bir kısıt yok.';
      }
    } else {
      sonuc = 'Yeterli metrik değerlendirilemediği için (toplam ' + totalEvaluated + ' metrik) net bir hüküm verilemiyor. Daha fazla veri girildiğinde değerlendirme güncellenecek.';
    }

    return {ne, neden, sonuc};
  };

  const downloadWordReport = () => {
    const now = new Date();
    const ticker = data.ticker || 'rapor';
    const imp = r.implausible || {};
    const impS = (id, fallback) => imp[id] ? 'suspect' : fallback;

    let body = '';
    body += pHeading(ticker.toUpperCase() + ' Temel Analiz Raporu — ' + headlineLabel, 32);
    const metaLine = [data.sector ? (SECTOR_PROFILES[data.sector]||{}).label : '', data.period ? 'Dönem: ' + data.period : ''].filter(Boolean).join(' · ');
    if (metaLine) body += pPlain(metaLine, {after:0});
    body += pPlain('Oluşturulma: ' + now.toLocaleString('tr-TR'), {after:200});

    if (verdict) {
      body += pPlain(verdict.text, {bold:true, after:60});
      body += pPlain(verdict.detail, {after:60});
      body += pPlain(negativeCount + '/' + totalEvaluated + ' olumsuz', {after:200});
    }

    // ÖZET KUTUSU — ilk 30 saniye
    if (totalEvaluated >= 5) {
      const {good, bad} = buildStrengthsWeaknesses();
      body += pHeading('İlk 30 Saniye — Özet', 24);
      body += pPlain('Güçlü Taraflar:', {bold:true, after:40});
      if (good.length === 0) body += pPlain('Belirgin güçlü taraf görünmüyor.', {after:80});
      else good.forEach(g => { body += pPlain('✓ ' + g, {after:40}); });
      body += pPlain('Zayıf Taraflar:', {bold:true, after:40});
      if (bad.length === 0) body += pPlain('Belirgin zayıf taraf görünmüyor.', {after:80});
      else bad.forEach(b => { body += pPlain('✗ ' + b, {after:40}); });
      body += pPlain('', {after:160});
    }

    body += pHeading('Kârlılık', 24);
    body += pRow('Brüt Kâr Marjı', r.grossMargin, secEval('grossMargin', r.grossMargin, sectorKey), {pct:true, ratioId:'grossMargin'});
    body += pRow('Faaliyet Kâr Marjı', r.operatingMargin, secEval('operatingMargin', r.operatingMargin, sectorKey), {pct:true, ratioId:'operatingMargin'});
    body += pRow('FAVÖK Marjı', r.ebitdaMargin, secEval('ebitdaMargin', r.ebitdaMargin, sectorKey), {pct:true, ratioId:'ebitdaMargin'});
    body += pRow('Net Kâr Marjı', r.netMargin, secEval('netMargin', r.netMargin, sectorKey), {pct:true, ratioId:'netMargin'});
    body += pRow('ROE', r.roe, secEval('roe', r.roe, sectorKey), {pct:true, ratioId:'roe', note:ttmNote(r)});
    body += pRow('ROA', r.roa, secEval('roa', r.roa, sectorKey), {pct:true, ratioId:'roa', note:ttmNote(r)});
    body += pRow('ROIC (Yatırılan Sermaye Kârlılığı)', r.roic, secEval('roic', r.roic, sectorKey), {pct:true, ratioId:'roic', note:ttmNote(r)});

    body += pHeading('Likidite (birincil: Asit-Test)', 24);
    body += pRow('Asit-Test', r.quickRatio, secEval('quickRatio', r.quickRatio, sectorKey), {ratioId:'quickRatio'});
    body += pRow('Cari Oran (ikincil)', r.currentRatio, secEval('currentRatio', r.currentRatio, sectorKey), {ratioId:'currentRatio'});
    body += pRow('Nakit Oranı (ikincil)', r.cashRatio, secEval('cashRatio', r.cashRatio, sectorKey), {ratioId:'cashRatio'});

    body += pHeading('Borçluluk (birincil: Net Borç/FAVÖK, Faiz Karşılama)', 24);
    body += pRow('Net Borç / FAVÖK', r.netDebtToEbitda, impS('netDebtToEbitda', secEval('netDebtToEbitda', r.netDebtToEbitda, sectorKey)), {suffix:'x', ratioId:'netDebtToEbitda', note:ttmNote(r)});
    body += pRow('Faiz Karşılama', r.interestCoverage, secEval('interestCoverage', r.interestCoverage, sectorKey), {suffix:'x', ratioId:'interestCoverage', note:ttmNote(r)});
    body += pRow('Yükümlülük / Özkaynak (ikincil)', r.debtToEquity, secEval('debtToEquity', r.debtToEquity, sectorKey), {suffix:'x', ratioId:'debtToEquity'});
    body += pRow('Yükümlülük / Aktif (ikincil)', r.debtToAssets, secEval('debtToAssets', r.debtToAssets, sectorKey), {pct:true, ratioId:'debtToAssets'});
    body += pRow('Özkaynak Oranı (ikincil)', r.equityRatio, secEval('equityRatio', r.equityRatio, sectorKey), {pct:true, ratioId:'equityRatio'});

    body += pHeading('Değerleme (birincil: F/K, EV/FAVÖK)', 24);
    body += pRow('F/K', r.peRatio, impS('peRatio', secEval('peRatio', r.peRatio, sectorKey)), {suffix:'x', ratioId:'peRatio', note:ttmNote(r)});
    body += pRow('EV/FAVÖK', r.evEbitda, impS('evEbitda', secEval('evEbitda', r.evEbitda, sectorKey)), {suffix:'x', ratioId:'evEbitda', note:ttmNote(r)});
    body += pRow('PD/DD (ikincil)', r.pbRatio, impS('pbRatio', secEval('pbRatio', r.pbRatio, sectorKey)), {suffix:'x', ratioId:'pbRatio'});
    body += pRow('F/S (ikincil)', r.psRatio, secEval('psRatio', r.psRatio, sectorKey), {suffix:'x', ratioId:'psRatio', note:ttmNote(r)});
    body += pRow('PD/FCF (ikincil)', r.pFcf, r.fcfNegative ? 'dangerous' : secEval('pFcf', r.pFcf, sectorKey), {suffix:'x', ratioId:'pFcf', note:ttmNote(r)});

    body += pHeading('Kazanç Kalitesi (Büyüme & Nakit)', 24);
    body += pRow('Hasılat Büyümesi (YoY)', r.revenueGrowth, secEval('revenueGrowth', r.revenueGrowth, sectorKey), {pct:true, ratioId:'revenueGrowth'});
    body += pRow('Net Kâr Büyümesi (YoY)', r.netIncomeGrowth, secEval('netIncomeGrowth', r.netIncomeGrowth, sectorKey), {pct:true, ratioId:'netIncomeGrowth'});
    body += pRow('Faaliyet Nakit / Net Kâr', r.cashFlowToNetIncome, secEval('cashFlowToNetIncome', r.cashFlowToNetIncome, sectorKey), {ratioId:'cashFlowToNetIncome', note:ttmNote(r)});
    body += pRow('Serbest Nakit Akışı', r.freeCashFlow, r.freeCashFlow !== null ? (r.freeCashFlow > 0 ? 'good' : 'dangerous') : 'na', {decimals:0, note:ttmNote(r)});

  // Ayrıca type="number" yerine type="text" kullanmamızın sebebi de bu — tarayıcının "number" input'u
  // hem çok basamaklı sayılarda imleci başa atıyor hem de noktalı/virgüllü yapıştırmayı reddediyor.
  const cleanNumberInput = (raw) => {
    if (raw === null || raw === undefined) return '';
    let s = String(raw).trim().replace(/\s/g, '');
    if (s === '') return '';
    const dotCount = (s.match(/\./g) || []).length;
    const commaCount = (s.match(/,/g) || []).length;
    if (dotCount > 1) s = s.replace(/\./g, '');
    if (commaCount > 1) s = s.replace(/,/g, '');
    if (s.includes(',') && s.includes('.')) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (s.includes(',')) {
      s = s.replace(',', '.');
    }
    return s.replace(/[^0-9.\-]/g, '');
  };

    // motor tarafından geriye doğru hesaplanmıştır (ör. Faaliyet Gideri = Brüt Kâr − FAVÖK).

      !data.revenue && !data.totalAssets
        ? h('div', {style:{textAlign:'center',color:'#78716c',padding:'50px 20px',fontSize:'16px',lineHeight:'1.6'}},

          )
        : (() => {
            const rev = num(data.revenue), gp = num(data.grossProfit), op = num(data.operatingProfit),
                  eb = num(data.ebitda), ni = num(data.netIncome), ie = num(data.interestExpense);
            const smm   = (rev!==null && gp!==null) ? rev-gp : null;
            const opex  = (gp!==null && eb!==null) ? gp-eb : null;
            const amort = (eb!==null && op!==null) ? eb-op : null;
            const ieAbs = ie!==null ? Math.abs(ie) : null;
            const vok   = (op!==null && ieAbs!==null) ? op-ieAbs : null;
            const vergiDiger = (vok!==null && ni!==null) ? vok-ni : null;

            const totA = num(data.totalAssets), curA = num(data.currentAssets), cashV = num(data.cash),
                  recv = num(data.receivables), inv = num(data.inventory);
            const otherCur = (curA!==null && cashV!==null && recv!==null && inv!==null) ? curA-cashV-recv-inv : null;
            const nonCurA  = (totA!==null && curA!==null) ? totA-curA : null;

            const totL = num(data.totalLiabilities), curL = num(data.currentLiabilities), eq = num(data.equity);
            const nonCurL  = (totL!==null && curL!==null) ? totL-curL : null;
            const totKaynak = (totL!==null && eq!==null) ? totL+eq : null;
            const balanceGap = (totKaynak!==null && totA!==null) ? totKaynak-totA : null;
            const balanceMismatch = balanceGap!==null && totA!==null && totA!==0 && Math.abs(balanceGap/totA) > 0.005;

            const std = num(data.shortTermDebt), ltd = num(data.longTermDebt);
            const interestBearing = (std!==null && ltd!==null) ? std+ltd : null;

            const ocf = num(data.operatingCashFlow), cap = num(data.capex);
            const capAbs = cap!==null ? Math.abs(cap) : null;
            const fcfPeriod = (ocf!==null && capAbs!==null) ? ocf-capAbs : null; // tek dönem — yukarıdaki iki satırla tutarlı
            const fcfTTM = r.freeCashFlow; // motorun oranlarda (PD/FCF vb.) kullandığı, son 4 çeyrek toplamı

            const signBadge = (s) => h('span', {style:{display:'inline-block',width:'18px',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:'15px',fontWeight:700,
              color: s==='=' ? '#d4a574' : s==='−' ? '#f87171' : s==='+' ? '#4ade80' : 'transparent'}}, s || '·');

            const chainRow = (label, val, s, opts) => {
              opts = opts || {};
              const isTotal = s === '=';
              return h('div', {key:label, style:{
                display:'grid', gridTemplateColumns:'20px 1fr auto', gap:'8px', alignItems:'baseline',
                padding: isTotal ? '8px 4px' : '6px 4px',
                borderTop: isTotal ? '1px solid rgba(212,165,116,0.3)' : 'none',
                borderBottom: isTotal ? '1px solid rgba(212,165,116,0.3)' : '1px solid rgba(212,165,116,0.06)',
                background: opts.final ? 'rgba(212,165,116,0.08)' : 'transparent',
              }},
                signBadge(s),
                h('span', {style:{fontSize: isTotal?'16px':'15px', color: opts.derived ? '#a8a29e' : '#e7e5e4', fontStyle: opts.derived?'italic':'normal', fontWeight: isTotal?600:400}},
                  label + (opts.derived ? ' (türetilmiş)' : '')),
                h('span', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize: isTotal?'18px':'17px',color: val===null?'#57534e':'#f5f5f4', fontWeight: isTotal?700:500}},
                  val===null?'—':fmt(val,{decimals:0}))
              );
            };

            return h('div', null,
              h('div', {style:{textAlign:'center',marginBottom:'16px',color:'#a3e635',fontSize:'15px',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600}},
                (data.ticker ? data.ticker + ' — ' : '') + (data.activePeriod || data.period || 'Dönem belirtilmedi') + (data.dataMode === 'annual' ? ' · Yıllık' : ' · Çeyreklik')
              ),
              h(S, {title:'Gelir Tablosu — kalem kalem', accent:'#a3e635'},
                chainRow('Hasılat', rev, ''),
                chainRow('Satılan Malın Maliyeti', smm, '−', {derived:true}),
                chainRow('Brüt Kâr', gp, '='),
                chainRow('Faaliyet Giderleri', opex, '−', {derived:true}),
                chainRow('FAVÖK', eb, '='),
                chainRow('Amortisman & İtfa', amort, '−', {derived:true}),
                chainRow('Faaliyet Kârı', op, '='),
                chainRow('Faiz Gideri', ieAbs, '−'),
                chainRow('Vergi Öncesi Kâr', vok, '=', {derived:true}),
                chainRow('Vergi & Diğer', vergiDiger, '−', {derived:true}),
                chainRow('Net Kâr', ni, '=', {final:true})
              ),
              h(S, {title:'Bilanço — Varlıklar', accent:'#7dd3fc'},
                chainRow('Nakit ve Benzerleri', cashV, ''),
                chainRow('Alacaklar', recv, '+'),
                chainRow('Envanter (Stoklar)', inv, '+'),
                chainRow('Diğer Dönen Varlıklar', otherCur, '+', {derived:true}),
                chainRow('Dönen Varlıklar', curA, '='),
                chainRow('Duran Varlıklar', nonCurA, '+', {derived:true}),
                chainRow('Toplam Varlıklar', totA, '=', {final:true})
              ),
              h(S, {title:'Bilanço — Kaynaklar', accent:'#7dd3fc'},
                chainRow('Cari Borçlar (kısa vadeli toplam)', curL, ''),
                chainRow('Uzun Vadeli Yükümlülükler', nonCurL, '+', {derived:true}),
                chainRow('Toplam Yükümlülükler', totL, '='),
                chainRow('Toplam Özkaynak', eq, '+'),
                chainRow('Toplam Kaynaklar', totKaynak, '=', {final:true}),
                balanceMismatch && h('div', {style:{marginTop:'6px',fontSize:'13px',color:'#fbbf24',fontStyle:'italic'}},
                  '⚠ Toplam Kaynaklar, Toplam Varlıklar ile tam örtüşmüyor (fark: ' + fmt(balanceGap,{decimals:0}) + '). Kalemlerden biri eksik/hatalı girilmiş olabilir.'),
                h('div', {style:{borderTop:'1px dashed rgba(212,165,116,0.15)',margin:'10px 0 6px',paddingTop:'6px',fontSize:'13px',color:'#78716c',textTransform:'uppercase',letterSpacing:'0.05em'}},
                  'Memo — Faizli Borç (yukarıdaki toplama dahil değil, ayrı bilgi)'),
                chainRow('Kısa Vadeli Borç (faizli)', std, ''),
                chainRow('Uzun Vadeli Borç (faizli)', ltd, '+'),
                chainRow('Toplam Faizli Borç', interestBearing, '=')
              ),
              h(S, {title:'Nakit Akışı', accent:'#fbbf24'},
                chainRow('Faaliyetlerden Sağlanan Nakit', ocf, ''),
                chainRow('Yatırım Harcaması (Capex)', capAbs, '−'),
                chainRow('Serbest Nakit Akışı (bu dönem)', fcfPeriod, '=', {final:true}),
                h('div', {style:{borderTop:'1px dashed rgba(212,165,116,0.15)',margin:'10px 0 6px',paddingTop:'6px',fontSize:'13px',color:'#78716c',textTransform:'uppercase',letterSpacing:'0.05em'}},
                  'Memo — TTM Serbest Nakit Akışı (oranlarda / PD-FCF\'de kullanılan)'),
                data.dataMode === 'annual'
                  ? h('div', {style:{fontSize:'13px',color:'#78716c',fontStyle:'italic',padding:'4px'}}, 'Yıllık modda TTM = bu dönemin kendisi, yukarıdaki ile aynı.')
                  : h('div', null,
                      chainRow('Son 4 Çeyrek Toplamı (TTM)', fcfTTM, '=', {derived:true}),
                      h('div', {style:{fontSize:'13px',color:'#78716c',fontStyle:'italic',padding:'4px 4px 0'}},
                        'Bu satır tek dönemin ' + (fcfPeriod!==null?fmt(fcfPeriod,{decimals:0}):'—') + ' değeriyle KARIŞTIRILMAMALI — 4 çeyreğin toplamıdır, bazı çeyreklerde nakit akışı zayıf/negatif olabilir.')
                    )
              )
            );
          })()
    ),

    // ───── EĞİTİM MODU PANELİ — Canlı 3-Tablo Modeli ─────
    activeTab === 'egitim' && h(EgitimModu, {data:data, r:r}),

    // Footer
    h('div', {style:{marginTop:'12px',paddingTop:'8px',borderTop:'1px solid rgba(212,165,116,0.15)',textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:'10px',color:'#57534e'}},
      'BIST Temel Analiz Konsolu v16 · Veriler tarayıcıda kalır · Yatırım tavsiyesi değildir'
    )
  );
}

// Render
const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(FundamentalAnalysis));
</script>
</body>
</html>

// ── YARDIMCI FONKSİYONLAR ──
const num = (v) => {
  if (v === '' || v === null || v === undefined || v === '-') return null;
  const n = parseFloat(String(v).replace(/,/g, '.').replace(/\s/g, ''));
  return isNaN(n) ? null : n;
};

const fmt = (n, opts = {}) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const { pct = false, decimals = 2, suffix = '' } = opts;
  const value = pct ? n * 100 : n;
  const formatted = value.toLocaleString('tr-TR', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
  return formatted + (pct ? '%' : suffix);
};

// TTM güven notu — F/K, ROE, EV/FAVÖK, F/S, PD/FCF, ROA, ROIC, Net Borç/FAVÖK, Faiz Karşılama,
// Nakit/Net Kâr satırlarında gösterilir. 4 çeyrek tam ise not yok (sessizce doğru); eksikse şeffaf uyarı.
const ttmNote = (r) => {
  if (!r.ttmApplicable) return null;
  if (r.ttmConfidence === 'full') return null;
  if (r.ttmConfidence === 'partial') return 'TTM tahmini: ' + r.ttmQuarterCount + ' çeyrek veriyle 4 çeyreğe yıllıklandırıldı — yaklaşık.';
  if (r.ttmConfidence === 'low') return 'TTM tahmini: sadece 1 çeyrek veri var, ×4 kaba tahmin — güvenilirliği düşük.';
  return 'TTM hesaplanamadı — çeyreklik veri eksik.';
};

// Kalite uyarı bayrakları — hem ekran panelinde hem Word raporunda kullanılır
const buildQualityFlags = (r, data, sectorKey) => {
  const flags = [];
  if (r.shareScaleApplied) flags.push({sev:'medium', title:'Hisse adedi ölçeği otomatik düzeltildi', detail:'×'+r.shareScaleApplied.factor+' faktörle. PD/DD '+r.shareScaleApplied.newPb.toFixed(2)+'x, F/K '+r.shareScaleApplied.newPe.toFixed(1)+'x.'});
  if (r.scaleAmbiguous) flags.push({sev:'high', title:'Ölçek tutarsız — oranlar güvenilmez', detail:'Hisse adedi, özkaynak veya net kârın birimi kontrol edilmeli.'});
  if (r.marginAnomaly && r.cashFlowToNetIncome !== null && r.cashFlowToNetIncome < 1) flags.push({sev:'high', title:'Kâğıt kâr — operasyonel değil, nakitle desteklenmiyor', detail:'Net marj '+fmt(r.netMargin,{pct:true})+' + OCF/NI '+fmt(r.cashFlowToNetIncome)+'.'});
  if (r.lowQualityEarnings) flags.push({sev:'high', title:'Faaliyet zararı + pozitif net kâr', detail:'Kazanç esas faaliyetten değil — kalite düşük.'});
  if (r.interestExceedsRevenue) flags.push({sev:'high', title:'Faiz gideri hasılatı aşıyor', detail:'Yapısal sürdürülemezlik.'});
  if (!r.ebitdaPositive && r.ebitda !== null) flags.push({sev:'high', title:'FAVÖK negatif', detail:'EV/FAVÖK ve Net Borç/FAVÖK anlamsız.'});
  if (r.cashFlowToNetIncome !== null && r.cashFlowToNetIncome < 0.5 && r.netIncome > 0 && !r.marginAnomaly) flags.push({sev:'high', title:'Nakit akışı net kârı doğrulamıyor', detail:'OCF/NI = '+fmt(r.cashFlowToNetIncome)+'.'});
  if (r.netDebtToEbitda !== null && r.netDebtToEbitda > 4 && sectorKey !== 'banka') flags.push({sev:'high', title:'Aşırı borç yükü', detail:'Net Borç/FAVÖK = '+fmt(r.netDebtToEbitda)+'x.'});
  if (r.receivableVsSalesGap !== null && r.receivableVsSalesGap > 0.30) flags.push({sev:'high', title:'Alacaklar satıştan çok daha hızlı büyüyor', detail:'Fark: +'+fmt(r.receivableVsSalesGap,{pct:true})+' puan. Şirket satıyor ama tahsilat zorlaşıyor olabilir.'});
  if (r.inventoryVsSalesGap !== null && r.inventoryVsSalesGap > 0.30 && !data.isReit) flags.push({sev:'medium', title:'Stoklar satıştan çok daha hızlı büyüyor', detail:'Fark: +'+fmt(r.inventoryVsSalesGap,{pct:true})+' puan. Mal elde kalıyor olabilir.'});
  if (data.hasInflationAdj) flags.push({sev:'medium', title:'TMS 29 enflasyon düzeltmesi', detail:'Dönemler arası karşılaştırma sınırlı.'});
  if (data.hasBioAssetGain) flags.push({sev:'medium', title:'Canlı varlık değer artışı', detail:'Net kârı şişirebilir — nakit dışı.'});
  if (data.hasRelatedParty) flags.push({sev:'medium', title:'İlişkili taraf / iştirak ağı', detail:'Çift sayım ve içsel fiyatlama riski.'});
  return flags;
};

const evalRatio = (value, thresholds) => {
  if (value === null || value === undefined || isNaN(value)) return 'na';
  const { excellent, good, weak, dangerous, inverse = false } = thresholds;
  if (inverse) {
    if (value <= excellent) return 'excellent';
    if (value <= good) return 'good';
    if (value <= weak) return 'weak';
    return 'dangerous';
  }
  if (value >= excellent) return 'excellent';
  if (value >= good) return 'good';
  if (value >= weak) return 'weak';
  return 'dangerous';
};

// Orijinali Buffett katmanıyla birlikte JSX/Babel ile yazılmıştı; Buffett kısmı BIST'te işe
// yaramadığı için atıldı, bu öğretim simülatörü v16'nın Babel-free h() formatına çevrilerek alındı.
// Amaç: bir bilanço/gelir tablosu kalemini değiştirince etkinin gelir tablosu, nakit akışı ve
// bilançoda nasıl zincirlendiğini canlı göstermek. Veri kaynağı: v16'nın annualStore'undaki
// (veya quarterlyStore'undaki) en güncel iki dönem — ayrı bir parser gerekmez.
function lmFmt(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  const r = Math.round(n);
  return (r < 0 ? '−' : '') + Math.abs(r).toLocaleString('tr-TR');
}
function lmNiceStep(width){
  if (!(width > 0)) return 1;
  const raw = width / 200;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const s = n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10;
  return Math.max(1, Math.round(s * mag));
}

// v16: years[0]/years[1] dizisi yerine doğrudan v16'nın aktif deposundan (annualStore veya
// quarterlyStore) en güncel iki dönemi okur. c = aktif dönem, p = bir önceki dönem.
const lmBuildSeed = (data) => {
  const isAnnual = data.dataMode === 'annual';
  const store = isAnnual ? (data.annualStore || {}) : (data.quarterlyStore || {});
  const sortKeyFn = isAnnual ? annualSortKey : periodSortKey;
  const periods = Object.keys(store).sort((a,b) => sortKeyFn(b) - sortKeyFn(a));
  const ok = !!(periods.length >= 2 && store[periods[0]] && store[periods[1]]
    && Object.keys(store[periods[1]]).length > 0 && (store[periods[0]].revenue || store[periods[0]].totalAssets));
  if (!ok) return { ok: false };
  const c = store[periods[0]], p = store[periods[1]];
  const g = (y, f) => (y && y[f] !== undefined && y[f] !== null && !isNaN(y[f])) ? y[f] : 0;

  const revenue = g(c,'revenue'), grossProfit = g(c,'grossProfit'), operatingProfit = g(c,'operatingProfit'),
        ebitda = g(c,'ebitda'), netIncome = g(c,'netIncome'), interest = Math.abs(g(c,'interestExpense')),
        cash = g(c,'cash'), recv = g(c,'receivables'), inv = g(c,'inventory'), curA = g(c,'currentAssets'),
        totA = g(c,'totalAssets'), curL = g(c,'currentLiabilities'), totL = g(c,'totalLiabilities'),
        ocf = g(c,'operatingCashFlow'), capex = Math.abs(g(c,'capex'));
  const pcash = g(p,'cash'), precv = g(p,'receivables'), pinv = g(p,'inventory'), pcurA = g(p,'currentAssets'),
        ptotA = g(p,'totalAssets'), pcurL = g(p,'currentLiabilities'), ptotL = g(p,'totalLiabilities'), pequity = g(p,'equity');

  const scale = Math.max(Math.abs(revenue), Math.abs(totA), 1);
  const smm = revenue - grossProfit;
  const opex = grossProfit - ebitda;
  const amort = ebitda - operatingProfit;
  const faiz = interest;
  const vergiDiger = (operatingProfit - faiz) - netIncome;
  const dAlacak = recv - precv;
  const dStok = inv - pinv;
  const dKisaBorc = curL - pcurL;
  const otherCurC = curA - cash - recv - inv;
  const otherCurP = pcurA - pcash - precv - pinv;
  const dDigerDonen = otherCurC - otherCurP;
  const dUzunYuk = (totL - curL) - (ptotL - pcurL);

  const inputs = { hasilat: revenue, smm, opex, amort, faiz, vergiDiger,
    dAlacak, dStok, dKisaBorc, dDigerDonen, capex, dUzunYuk, temettu: 0, sermaye: 0 };

  const base = { nakit_o: pcash, alacak_o: precv, stok_o: pinv, digerDonen_o: otherCurP,
    duran_o: (ptotA - pcurA), kisaBorc_o: pcurL, uzunYuk_o: (ptotL - pcurL), ozk_o: pequity,
    scale, yearC: periods[0] || '', yearP: periods[1] || '' };

  const netkar = (revenue - smm) - opex - amort - faiz - vergiDiger;
  const faaliyet0 = netkar + amort - dAlacak - dStok - dDigerDonen + dKisaBorc;
  const opPlug = ocf - faaliyet0;
  const finansman0 = dUzunYuk;
  const finPlug = (cash - pcash) - ocf - (-capex) - finansman0;
  const duranPlug = (totA - curA) - (base.duran_o + capex - amort);
  const plugs = { opPlug, finPlug, duranPlug };

  return { ok: true, inputs, base, plugs };
};

const lmCompute = (base, I, P) => {
  const brut = I.hasilat - I.smm;
  const ebit = brut - I.opex - I.amort;
  const favok = ebit + I.amort;
  const vok = ebit - I.faiz;
  const netkar = vok - I.vergiDiger;
  const faaliyet = netkar + I.amort - I.dAlacak - I.dStok - I.dDigerDonen + I.dKisaBorc + P.opPlug;
  const yatirim = -I.capex;
  const finansman = I.dUzunYuk - I.temettu + I.sermaye + P.finPlug;
  const cfNet = faaliyet + yatirim + finansman;
  const nakit_e = base.nakit_o + cfNet;
  const alacak_e = base.alacak_o + I.dAlacak;
  const stok_e = base.stok_o + I.dStok;
  const digerDonen_e = base.digerDonen_o + I.dDigerDonen;
  const duran_e = base.duran_o + I.capex - I.amort + P.duranPlug;
  const varlik_e = nakit_e + alacak_e + stok_e + digerDonen_e + duran_e;
  const kisaBorc_e = base.kisaBorc_o + I.dKisaBorc;
  const uzunYuk_e = base.uzunYuk_o + I.dUzunYuk;
  const ozk_e = varlik_e - kisaBorc_e - uzunYuk_e;
  const ozkEarn = netkar - I.temettu + I.sermaye;
  const ozkOther = ozk_e - (base.ozk_o + ozkEarn);
  const kaynak_e = kisaBorc_e + uzunYuk_e + ozk_e;
  const varlik_o = base.nakit_o + base.alacak_o + base.stok_o + base.digerDonen_o + base.duran_o;
  const kaynak_o = base.kisaBorc_o + base.uzunYuk_o + base.ozk_o;
  return { brut, ebit, favok, vok, netkar, faaliyet, yatirim, finansman, cfNet, nakit_e,
    alacak_e, stok_e, digerDonen_e, duran_e, varlik_e, kisaBorc_e, uzunYuk_e, ozk_e, ozkEarn, ozkOther,
    kaynak_e, varlik_o, kaynak_o, smm: I.smm, opex: I.opex, amort: I.amort, faiz: I.faiz, vergiDiger: I.vergiDiger,
    capex: I.capex, temettu: I.temettu };
};

// Dönem etiketini sıralanabilir biçime çevirir: "2026Q1" -> 20261, "2025Q4" -> 20254 (büyüklük karşılaştırması için)
const periodSortKey = (label) => {
  const m = String(label).match(/^(\d{4})Q([1-4])$/);
  if (m) return parseInt(m[1],10)*10 + parseInt(m[2],10);
  const y = parseInt(label,10);
  return isNaN(y) ? 0 : y*10;
};

// Bir çeyreğin "bir önceki yıl aynı çeyreği" etiketini üretir: "2026Q1" -> "2025Q1"
const sameQuarterPrevYear = (label) => {
  const m = String(label).match(/^(\d{4})Q([1-4])$/);
  if (!m) return null;
  return (parseInt(m[1],10)-1) + 'Q' + m[2];
};

// Bir çeyreğin "hemen önceki çeyreği" etiketini üretir: "2026Q1" -> "2025Q4"
const prevQuarter = (label) => {
  const m = String(label).match(/^(\d{4})Q([1-4])$/);
  if (!m) return null;
  const y = parseInt(m[1],10), q = parseInt(m[2],10);
  return q === 1 ? (y-1) + 'Q4' : y + 'Q' + (q-1);
};

const annualSortKey = (label) => {

};
// Yıllık modda "önceki yıl" = etiket - 1 (çeyreğe ihtiyaç yok, YoY doğrudan ardışık yıl farkı)
const prevAnnualYear = (label) => {

// ── TTM (SON 12 AY) DÜZELTMESİ ──
// KÖK SORUN: çeyreklik modda F/K, ROE, ROA, ROIC, EV/FAVÖK, F/S, PD/FCF, Net Borç/FAVÖK,
// Faiz Karşılama, Nakit/Net Kâr gibi oranlar "fiyat/bilanço (stok, dönem-sonu)" ile
// "tek çeyreğin ham kazanç akışı"nı doğrudan bölüyordu. Kazanç tek çeyrek olduğu için yıllığın
// ~1/4'ü büyüklüğünde kalıyor — kazanç paydaysa oran ~4 kat şişiyor (F/K, EV/FAVÖK, F/S, PD/FCF),
// kazanç payda değilse (ROE, ROA) oran ~1/4'e küçülüyor. Marjlar (brüt/net/FAVÖK marjı) ve YoY
// büyüme oranları etkilenmez — onlarda pay ve payda zaten aynı döneme ait, TTM gerektirmez.
// ÇÖZÜM: bu akış kalemlerini (revenue, grossProfit, operatingProfit, ebitda, netIncome,
// interestExpense, operatingCashFlow, capex) kullanan oranlar için, aktif çeyrek + önceki 3 çeyreğin
// toplamını (TTM) al. Yıllık modda zaten tam yıl verisi var, TTM = kendisi (değişiklik yok).
const TTM_FLOW_FIELDS = ['revenue','grossProfit','operatingProfit','ebitda','netIncome','interestExpense','operatingCashFlow','capex'];

// Bir alanın, period'dan geriye doğru en fazla 4 çeyreklik zincirini toplar.
// Dönderir: {sum, quarterCount} — quarterCount < 4 ise toplam eksik dönemlerle sınırlıdır (kısmi TTM).
const ttmFieldSum = (store, period, field) => {
  let p = period, sum = 0, quarterCount = 0;
  for (let i = 0; i < 4 && p; i++) {
    const rec = store[p];
    if (rec && rec[field] !== undefined && rec[field] !== null && !isNaN(rec[field])) {
      sum += rec[field];
      quarterCount++;
    } else if (!rec) {
      break; // zincirde boşluk varsa daha geriye gitme — kısmi ama ardışık TTM
    }
    p = prevQuarter(p);
  }
  return { sum, quarterCount };
};

// Aktif dönem için TTM akış kalemlerini üretir.
// confidence: 'full' (4/4 çeyrek ya da yıllık mod), 'partial' (2-3 çeyrek — 4/n ile
// yıllıklandırılmış tahmin), 'low' (1 çeyrek — ×4 kaba tahmin), 'none' (veri yok).
const buildTTM = (data) => {
  const mode = data.dataMode || 'quarterly';
  const period = data.activePeriod;
  if (!period) return { ok:false, confidence:'none', quarterCount:0, applicable: mode==='quarterly' };

  if (mode === 'annual') {
    const rec = (data.annualStore || {})[period];
    if (!rec) return { ok:false, confidence:'none', quarterCount:0, applicable:false };
    const out = { ok:true, confidence:'full', quarterCount:1, applicable:false };
    TTM_FLOW_FIELDS.forEach(f => { out[f] = (rec[f] !== undefined && rec[f] !== null && !isNaN(rec[f])) ? rec[f] : null; });
    return out;
  }

  const store = data.quarterlyStore || {};
  const out = { ok:false, applicable:true };
  let maxN = 0;
  TTM_FLOW_FIELDS.forEach(f => {
    const { sum, quarterCount } = ttmFieldSum(store, period, f);
    maxN = Math.max(maxN, quarterCount);
    if (quarterCount === 0) { out[f] = null; return; }
    // n<4 çeyrekle toplanan tutarı 4/n ile yıllıklandır — eksik dönemler için en iyi tahmin
    out[f] = quarterCount < 4 ? sum * (4 / quarterCount) : sum;
  });
  out.quarterCount = maxN;
  out.ok = maxN > 0;
  out.confidence = maxN >= 4 ? 'full' : (maxN >= 2 ? 'partial' : (maxN === 1 ? 'low' : 'none'));
  return out;
};

// ── v15/v16 KÖPRÜ FONKSİYONU ──
// Seçilen dönemin (period) verisini ilgili depodan (quarterlyStore veya annualStore) okuyup
// data'nın ana alanlarına (revenue, netIncome, ...) ve YoY karşılaştırması için prev* alanlarına
// otomatik dağıtır. Mali sadece "hangi dönemi görüntülüyorum" seçer; motor karşılaştırma verisini kendisi bulur.
// mode: 'quarterly' (varsayılan) veya 'annual' — hangi depodan okunacağını belirler.
const applyPeriodToData = (d, period, mode) => {
  const effMode = mode || d.dataMode || 'quarterly';
  const store = effMode === 'annual' ? (d.annualStore || {}) : (d.quarterlyStore || {});
  const rec = store[period];
  if (!rec) return {...d, activePeriod: period, period: period || '', dataMode: effMode};

  const next = {...d, activePeriod: period, period: period, dataMode: effMode};
  // v17: sharesOutstanding (Ödenmiş Sermaye) burada BLANKET RESET'in dışında tutulur. Fintables
  // bu alanı hiç vermiyor, Mali'nin elle girdiği tek değer bu — Fiyat gibi dönemler arası GEÇİŞTE
  // SİLİNMEMELİ (nadiren değişir, sermaye artırımı olmadıkça sabittir). Sadece henüz boşsa ve
  // depoda (eski Investing.com akışından) bir değer varsa otomatik doldurulur, elle girileni asla ezmez.
  QUARTERLY_FIELDS.forEach(f => { if (f === 'sharesOutstanding') return; next[f] = (rec[f] !== undefined && rec[f] !== null) ? rec[f] : ''; });
  if ((next.sharesOutstanding === '' || next.sharesOutstanding === undefined || next.sharesOutstanding === null) && rec.sharesOutstanding != null) {
    next.sharesOutstanding = rec.sharesOutstanding;
  }

  if (effMode === 'annual') {
    // YILLIK MOD: YoY = doğrudan önceki yıl. QoQ kavramı yok — pasif/gri gösterilecek.
    const prevYearLabel = prevAnnualYear(period);
    const prevRec = prevYearLabel ? store[prevYearLabel] : null;
    next.prevRevenue = prevRec && prevRec.revenue != null ? prevRec.revenue : '';
    next.prevNetIncome = prevRec && prevRec.netIncome != null ? prevRec.netIncome : '';
    next.prevEquity = prevRec && prevRec.equity != null ? prevRec.equity : '';
    next.prevAssets = prevRec && prevRec.totalAssets != null ? prevRec.totalAssets : '';
    next.prevReceivables = prevRec && prevRec.receivables != null ? prevRec.receivables : '';
    next.prevInventory = prevRec && prevRec.inventory != null ? prevRec.inventory : '';
    next._yoyPeriodLabel = prevYearLabel || '';
    next._yoyAvailable = !!prevRec;
    // QoQ yıllık modda anlamsız — sistematik olarak kapalı, panel bunu gri gösterecek
    next._qoqPeriodLabel = '';
    next._qoqAvailable = false;
    next._qoqRevenueGrowth = null;
    next._qoqNetIncomeGrowth = null;
    return next;
  }

  // ÇEYREKLİK MOD (mevcut davranış, değişmedi)
  const prevYearLabel = sameQuarterPrevYear(period);
  const prevRec = prevYearLabel ? store[prevYearLabel] : null;
  next.prevRevenue = prevRec && prevRec.revenue != null ? prevRec.revenue : '';
  next.prevNetIncome = prevRec && prevRec.netIncome != null ? prevRec.netIncome : '';
  next.prevEquity = prevRec && prevRec.equity != null ? prevRec.equity : '';
  next.prevAssets = prevRec && prevRec.totalAssets != null ? prevRec.totalAssets : '';
  next.prevReceivables = prevRec && prevRec.receivables != null ? prevRec.receivables : '';
  next.prevInventory = prevRec && prevRec.inventory != null ? prevRec.inventory : '';
  next._yoyPeriodLabel = prevYearLabel || '';
  next._yoyAvailable = !!prevRec;

  // QoQ karşılaştırması: hemen önceki çeyrek (sadece bilgi amaçlı, ayrı saklanır)
  const prevQLabel = prevQuarter(period);
  const prevQRec = prevQLabel ? store[prevQLabel] : null;
  next._qoqPeriodLabel = prevQLabel || '';
  next._qoqAvailable = !!prevQRec;
  next._qoqRevenueGrowth = (prevQRec && prevQRec.revenue) ? (rec.revenue - prevQRec.revenue) / Math.abs(prevQRec.revenue) : null;
  next._qoqNetIncomeGrowth = (prevQRec && prevQRec.netIncome) ? (rec.netIncome - prevQRec.netIncome) / Math.abs(prevQRec.netIncome) : null;

  return next;
};

// ── ORAN HESAPLAMA ──
const computeRatios = (d) => {
  const revenue = num(d.revenue);
  const grossProfit = num(d.grossProfit);
  const operatingProfit = num(d.operatingProfit);
  const ebitda = num(d.ebitda);
  const netIncome = num(d.netIncome);
  const interestExpenseRaw = num(d.interestExpense);
  const interestExpense = interestExpenseRaw !== null ? Math.abs(interestExpenseRaw) : null;

  // ── TTM: değerleme/getiri oranları için annualize edilmiş akış kalemleri ──
  // Çeyreklik modda d.revenue/d.netIncome/... TEK ÇEYREĞİN ham değeridir — F/K, ROE, EV/FAVÖK gibi
  // "fiyat(stok) ÷ kazanç(akım)" oranlarında doğrudan kullanılırsa oran ~4 kat çarpıtılır (bkz. buildTTM
  // yorumu). Bu yüzden SADECE o oranlar için ttm* değişkenlerini kullanıyoruz; marj ve YoY büyüme
  // hesapları hâlâ yukarıdaki ham (tek dönem) değerleri kullanır — onlarda TTM gerekmez.
  const ttm = buildTTM(d);
  const ttmOrRaw = (ttmVal, rawVal) => (ttmVal !== undefined && ttmVal !== null) ? ttmVal : rawVal;
  const ttmRevenue = ttmOrRaw(ttm.revenue, revenue);
  const ttmOperatingProfit = ttmOrRaw(ttm.operatingProfit, operatingProfit);
  const ttmEbitda = ttmOrRaw(ttm.ebitda, ebitda);
  const ttmNetIncome = ttmOrRaw(ttm.netIncome, netIncome);
  const ttmInterestExpenseRaw = ttmOrRaw(ttm.interestExpense, interestExpenseRaw);
  const ttmInterestExpense = ttmInterestExpenseRaw !== null ? Math.abs(ttmInterestExpenseRaw) : null;
  const ttmOperatingCashFlow = ttmOrRaw(ttm.operatingCashFlow, num(d.operatingCashFlow));
  const ttmCapexRaw = ttmOrRaw(ttm.capex, num(d.capex));
  const ttmCapex = ttmCapexRaw !== null ? Math.abs(ttmCapexRaw) : null;

  const prevRevenue = num(d.prevRevenue);
  const prevNetIncome = num(d.prevNetIncome);
  const prevEquity = num(d.prevEquity);
  const prevAssets = num(d.prevAssets);
  const prevReceivables = num(d.prevReceivables);
  const prevInventory = num(d.prevInventory);
  const totalAssets = num(d.totalAssets);
  const currentAssets = num(d.currentAssets);
  const cash = num(d.cash);
  const inventory = num(d.inventory);
  const receivables = num(d.receivables);
  const totalLiabilities = num(d.totalLiabilities);
  const currentLiabilities = num(d.currentLiabilities);
  const shortTermDebt = num(d.shortTermDebt);
  const longTermDebt = num(d.longTermDebt);
  const equity = num(d.equity);
  const operatingCashFlow = num(d.operatingCashFlow);
  const capexRaw = num(d.capex);
  const capex = capexRaw !== null ? Math.abs(capexRaw) : null;
  const price = num(d.price);
  const sharesRaw = num(d.sharesOutstanding);

  const safeDiv = (a, b) => (a === null || b === null || b === 0) ? null : a / b;

  // Otomatik ölçek düzeltme (hisse adedi)
  let shares = sharesRaw;
  let shareScaleApplied = null;
  let scaleAmbiguous = false;
  if (price !== null && price > 0 && equity !== null && equity > 0 && sharesRaw !== null && sharesRaw > 0 && netIncome !== null && netIncome > 0) {
    const pbAt = (sh) => price / (equity / sh);
    const peAt = (sh) => price / (netIncome / sh);
    const pb0 = pbAt(sharesRaw), pe0 = peAt(sharesRaw);
    const PB_LO=0.1, PB_HI=25, PE_LO=1, PE_HI=80;
    const pbBad = pb0 < PB_LO || pb0 > PB_HI;
    const peBad = pe0 < PE_LO || pe0 > PE_HI;
    if (pbBad || peBad) {
      const candidates = [1e-3,1e-2,1e-1,1,1e1,1e2,1e3,1e4,1e5,1e6];
      let bothFix = null;
      for (const f of candidates) {
        const sh = sharesRaw * f;
        const pb = pbAt(sh), pe = peAt(sh);
        if (pb >= PB_LO && pb <= PB_HI && pe >= PE_LO && pe <= PE_HI) {
          const dist = Math.abs(Math.log(pb)-Math.log(2)) + Math.abs(Math.log(pe)-Math.log(12));
          if (!bothFix || dist < bothFix.dist) bothFix = {f, sh, pb, pe, dist};
        }
      }
      if (bothFix && bothFix.f !== 1) {
        shares = bothFix.sh;
        shareScaleApplied = {factor:bothFix.f, oldShares:sharesRaw, newShares:bothFix.sh, oldPb:pb0, newPb:bothFix.pb, oldPe:pe0, newPe:bothFix.pe};
      } else {
        scaleAmbiguous = true;
      }
    }
  }

  const totalDebt = (shortTermDebt !== null && longTermDebt !== null) ? shortTermDebt + longTermDebt : null;
  const netDebt = (totalDebt !== null && cash !== null) ? totalDebt - cash : null;
  const marketCap = (price !== null && shares !== null) ? price * shares : null;
  const enterpriseValue = (marketCap !== null && netDebt !== null) ? marketCap + netDebt : null;
  const eps = safeDiv(ttmNetIncome, shares); // TTM — F/K annualize kazanç ister
  const bookValuePerShare = safeDiv(equity, shares);
  const freeCashFlow = (ttmOperatingCashFlow !== null && ttmCapex !== null) ? ttmOperatingCashFlow - ttmCapex : null; // TTM
  const avgEquity = (equity !== null && prevEquity !== null) ? (equity + prevEquity) / 2 : equity;
  const avgAssets = (totalAssets !== null && prevAssets !== null) ? (totalAssets + prevAssets) / 2 : totalAssets;

  // Marjlar: pay ve payda aynı döneme ait akım — TTM gerekmez, ham (tek dönem) değerlerle hesaplanır.
  const grossMargin = safeDiv(grossProfit, revenue);
  const operatingMargin = safeDiv(operatingProfit, revenue);
  const netMargin = safeDiv(netIncome, revenue);
  const ebitdaMargin = safeDiv(ebitda, revenue);
  // Getiri oranları: kazanç (akım) / bilanço (stok, dönem-sonu) — kazanç TTM olmalı.
  const roe = safeDiv(ttmNetIncome, avgEquity);
  const roa = safeDiv(ttmNetIncome, avgAssets);
  const currentRatio = safeDiv(currentAssets, currentLiabilities);
  const quickRatio = (currentAssets !== null && inventory !== null && currentLiabilities) ? (currentAssets - inventory) / currentLiabilities : null;
  const cashRatio = safeDiv(cash, currentLiabilities);
  const debtToEquity = safeDiv(totalLiabilities, equity);
  const debtToAssets = safeDiv(totalLiabilities, totalAssets);
  const ebitdaPositive = ttmEbitda !== null && ttmEbitda > 0; // TTM
  const netDebtToEbitda = ebitdaPositive ? safeDiv(netDebt, ttmEbitda) : null; // TTM
  const interestCoverage = safeDiv(ttmOperatingProfit, ttmInterestExpense); // TTM (ikisi de akım)
  const equityRatio = safeDiv(equity, totalAssets);
  const assetTurnover = safeDiv(ttmRevenue, avgAssets); // TTM
  const inventoryTurnover = safeDiv(ttmRevenue, inventory); // TTM
  const peRatio = (price !== null && eps !== null && eps > 0) ? price / eps : null; // TTM (eps üzerinden)
  const pbRatio = safeDiv(price, bookValuePerShare);
  const evPositive = enterpriseValue !== null && enterpriseValue > 0;
  const evEbitda = (ebitdaPositive && evPositive) ? safeDiv(enterpriseValue, ttmEbitda) : null; // TTM
  const psRatio = safeDiv(marketCap, ttmRevenue); // TTM
  const fcfPositive = freeCashFlow !== null && freeCashFlow > 0;
  const fcfNegative = freeCashFlow !== null && freeCashFlow <= 0;
  const pFcf = fcfPositive ? safeDiv(marketCap, freeCashFlow) : null; // TTM (freeCashFlow üzerinden)

  const marginAnomaly = (netMargin !== null && Math.abs(netMargin) > 0.60);
  const lowQualityEarnings = (operatingProfit !== null && netIncome !== null && operatingProfit < 0 && netIncome > 0);
  const interestExceedsRevenue = (interestExpense !== null && revenue !== null && interestExpense > revenue && revenue > 0);
  // Büyüme oranları: aynı çeyreğin bir yıl öncesine kıyası (apples-to-apples) — TTM gerekmez.
  const revenueGrowth = (revenue !== null && prevRevenue !== null && prevRevenue !== 0) ? (revenue - prevRevenue) / Math.abs(prevRevenue) : null;
  const netIncomeGrowth = (netIncome !== null && prevNetIncome !== null && prevNetIncome !== 0) ? (netIncome - prevNetIncome) / Math.abs(prevNetIncome) : null;
  // Nakit/kâr kalitesi oranı: tek çeyrekte mevsimsellikten çok gürültülü çıkıyor (ör. GRSEL Q1'de
  // 0,25 → gerçek TTM 0,82) — TTM ile hesaplanır.
  const cashFlowToNetIncome = safeDiv(ttmOperatingCashFlow, ttmNetIncome); // TTM
  const operatingVsNetSign = (operatingProfit !== null && netIncome !== null) ? Math.sign(operatingProfit) !== Math.sign(netIncome) : false;

  // ROIC: NOPAT (faaliyet kârı, %20 BIST kurumlar vergisi varsayımıyla vergi sonrası) / Yatırılan Sermaye (Borç + Özkaynak - Nakit). TTM.
  const investedCapital = (totalDebt !== null && equity !== null) ? (totalDebt + equity - (cash || 0)) : null;
  const nopat = ttmOperatingProfit !== null ? ttmOperatingProfit * (1 - 0.20) : null; // TTM
  const roic = (investedCapital !== null && investedCapital > 0) ? safeDiv(nopat, investedCapital) : null;

  // Alacak/Stok büyümesi — satış büyümesiyle kıyas (kazanç kalitesi sinyali)
  const receivableGrowth = (receivables !== null && prevReceivables !== null && prevReceivables !== 0) ? (receivables - prevReceivables) / Math.abs(prevReceivables) : null;
  const inventoryGrowth = (inventory !== null && prevInventory !== null && prevInventory !== 0) ? (inventory - prevInventory) / Math.abs(prevInventory) : null;
  // Fark: alacak/stok büyümesi - satış büyümesi (puan farkı). Pozitifse alacak/stok satıştan hızlı büyüyor = alarm.
  const receivableVsSalesGap = (receivableGrowth !== null && revenueGrowth !== null) ? (receivableGrowth - revenueGrowth) : null;
  const inventoryVsSalesGap = (inventoryGrowth !== null && revenueGrowth !== null) ? (inventoryGrowth - revenueGrowth) : null;

  // DuPont ayrıştırması: ROE = Net Kâr Marjı(TTM) × Aktif Devir Hızı(TTM) × Özkaynak Çarpanı.
  // Üçü de zaten yukarıda ayrı ayrı hesaplanan TTM/ortalama değerlerden türetilir — ikinci bir
  // formül YAZILMADI, sadece roe/roa/assetTurnover'ın kullandığı aynı ara değerler (ttmNetIncome,
  // ttmRevenue, avgEquity, avgAssets) dışa açılıp çarpanlarına ayrılıyor (eğitim amaçlı).
  const dupontNetMargin = safeDiv(ttmNetIncome, ttmRevenue);
  const dupontEquityMultiplier = safeDiv(avgAssets, avgEquity);
  const dupont = { netMargin: dupontNetMargin, assetTurnover, equityMultiplier: dupontEquityMultiplier, roe };

  const implausible = {};
  if (pbRatio !== null && pbRatio > 0 && (pbRatio < 0.1 || pbRatio > 50))
    implausible.pbRatio = 'PD/DD = ' + pbRatio.toFixed(2) + 'x — ölçek hatası şüphesi (0.1–50 dışı)';
  if (netDebtToEbitda !== null && Math.abs(netDebtToEbitda) > 50)
    implausible.netDebtToEbitda = 'Net Borç/FAVÖK = ' + netDebtToEbitda.toFixed(1) + 'x — 50x üzeri gerçekçi değil';
  if (evEbitda !== null && Math.abs(evEbitda) > 80)
    implausible.evEbitda = 'EV/FAVÖK = ' + evEbitda.toFixed(1) + 'x — 80x üzeri gerçekçi değil';
  if (peRatio !== null && peRatio > 200)
    implausible.peRatio = 'F/K = ' + peRatio.toFixed(0) + 'x — 200x üzeri ölçek hatası şüphesi';

  return {
    grossMargin, operatingMargin, netMargin, ebitdaMargin, roe, roa, roic,
    currentRatio, quickRatio, cashRatio,
    debtToEquity, debtToAssets, netDebtToEbitda, interestCoverage, equityRatio,
    assetTurnover, inventoryTurnover,
    peRatio, pbRatio, evEbitda, psRatio, pFcf,
    revenueGrowth, netIncomeGrowth, cashFlowToNetIncome, operatingVsNetSign,
    receivableGrowth, inventoryGrowth, receivableVsSalesGap, inventoryVsSalesGap,
    netDebt, marketCap, enterpriseValue, eps, bookValuePerShare, freeCashFlow,
    operatingProfit, netIncome, ebitdaPositive, fcfNegative, lowQualityEarnings, marginAnomaly,
    interestExceedsRevenue, evPositive, implausible, scaleAmbiguous, shareScaleApplied,
    revenue, ebitda, interestExpense, dupont,
    // TTM şeffaflığı: F/K, ROE, EV/FAVÖK, F/S, PD/FCF, ROA, ROIC, Net Borç/FAVÖK, Faiz Karşılama,
    // Nakit/Net Kâr — hepsi bu TTM'i kullanır. confidence: 'full' (4/4 çeyrek), 'partial' (2-3, ×4/n
    // yıllıklandırılmış), 'low' (1 çeyrek, ×4 kaba tahmin), 'none' (veri yok).
    ttmConfidence: ttm.confidence, ttmQuarterCount: ttm.quarterCount, ttmApplicable: !!ttm.applicable,
  };
};

// ── EXCEL PARSE (Investing.com formatı — çeyreklik veya yıllık) ──
// Dönderir: {periods: ['2026Q1','2025Q4',...] (yeniden eskiye sıralı), data: {fieldName: {periodLabel: değer}}}
// mode: 'quarterly' (varsayılan) -> tarih hücresinden ay okuyup "YYYYQN" üretir
//       'annual' -> ay bilgisini hiç okumaz, etiketi her zaman düz "YYYY" yapar (tahmine gerek yok, buton zaten niyeti belirtti)
const QUARTER_FROM_MONTH = {3:1, 6:2, 9:3, 12:4};

const parseInvestingSheet = (ws, mode) => {
  const effMode = mode || 'quarterly';
  const range = XLSX.utils.decode_range(ws['!ref']);
  if (range.e.r < 2) return null;

  // ── v16: OTOMATİK SÜTUN/SATIR TESPİTİ ──
  // Investing.com export'ları bazen baştan bir veya daha fazla boş sütun/satır içerebilir
  // (Mali bunu elle kesip düzeltiyordu). "Dönem Sonu:" hücresini arayarak gerçek başlangıç
  // satırını ve sütununu kendimiz buluyoruz — sabit {r:0,c:0} varsayımına güvenmiyoruz.
  let headerRow = -1, labelCol = -1;
  outer:
  for (let r = 0; r <= Math.min(range.e.r, 5); r++) {
    for (let c = 0; c <= Math.min(range.e.c, 5); c++) {
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      if (cell && cell.v && String(cell.v).trim().toLowerCase().startsWith('dönem sonu')) {
        headerRow = r; labelCol = c;
        break outer;
      }
    }
  }
  // "Dönem Sonu:" bulunamazsa eski sabit varsayıma düş (geriye dönük uyumluluk)
  if (headerRow === -1) { headerRow = 0; labelCol = 0; }
  const dateRow = headerRow + 1; // tarih satırı, başlık satırının bir altı
  const firstDataCol = labelCol + 1; // ilk yıl/değer sütunu, etiket sütununun bir sağı

  // R(headerRow): "Dönem Sonu:" + yıllar (integer)
  // R(dateRow): tam tarih — SADECE ay/gün okunur, yıl başlık satırından alınır (sadece çeyreklik modda)
  const periods = []; // {label, col}
  for (let col = firstDataCol; col <= range.e.c; col++) {
    const yCell = ws[XLSX.utils.encode_cell({r:headerRow, c:col})];
    if (!yCell || yCell.v === undefined || yCell.v === '') continue;
    const yearVal = parseInt(String(yCell.v).trim(), 10);
    if (isNaN(yearVal) || yearVal < 1990 || yearVal > 2100) continue;

    let label = String(yearVal); // varsayılan: yıllık etiket
    if (effMode === 'quarterly') {
      const dCell = ws[XLSX.utils.encode_cell({r:dateRow, c:col})];
      if (dCell && dCell.v) {
        let month = null;
        if (dCell.v instanceof Date) month = dCell.v.getMonth() + 1;
        else if (typeof dCell.v === 'number') {
          // Excel seri tarih numarası olabilir
          const d = XLSX.SSF ? XLSX.SSF.parse_date_code(dCell.v) : null;
          if (d) month = d.m;
        } else {
          const m = String(dCell.v).match(/(\d{1,2})[\/\-](\d{1,2})/); // gün/ay veya ay/gün ihtimali
          if (m) month = parseInt(m[2] && parseInt(m[2],10) <= 12 ? m[2] : m[1], 10);
        }
        const q = month ? QUARTER_FROM_MONTH[month] : null;
        if (q) label = yearVal + 'Q' + q;
      }
    }
    // effMode === 'annual' ise label zaten düz yıl olarak kalır — ay hücresine hiç bakılmaz
    periods.push({label, col});
  }
  if (periods.length === 0) return null;

  const dataStartRow = dateRow + 1; // veri satırları, tarih satırının bir altından başlar
  const data = {};
  for (let row = dataStartRow; row <= range.e.r; row++) {
    const labelCell = ws[XLSX.utils.encode_cell({r:row, c:labelCol})];
    if (!labelCell || !labelCell.v) continue;
    const label = String(labelCell.v).trim().toLowerCase();
    const fieldName = INVESTING_MAP[label];
    if (!fieldName) continue;
    const periodValues = {};
    for (const {label: pLabel, col} of periods) {
      const cell = ws[XLSX.utils.encode_cell({r:row, c:col})];
      if (cell && cell.v !== undefined && cell.v !== '' && cell.v !== '-') {
        const n = typeof cell.v === 'number' ? cell.v : parseFloat(String(cell.v).replace(',','.'));
        if (!isNaN(n)) periodValues[pLabel] = n;
      }
    }
    data[fieldName] = periodValues;
  }
  // Yeniden eskiye sıralama (dönem etiketi karşılaştırması: "2026Q1" > "2025Q4" string olarak da çalışır çünkü format sabit)
  const sortedPeriods = periods.map(p => p.label).sort((a,b) => b.localeCompare(a, undefined, {numeric:true}));
  return {periods: [...new Set(sortedPeriods)], data};
};

// ══════════════════════════════════════════════════════════════════════════
// ── v17: FINTABLES PARSE (banka-dışı sektörler — Faz 1) ──
// Investing.com üyeliği bırakıldığı için eklendi. Eski INVESTING_MAP / parseInvestingSheet
// yukarıda dokunulmadan duruyor (geriye uyumluluk / yedek), ama artık kullanılmıyor.
//
// Fintables tek bir .xlsx dosyasında 7 sayfa veriyor: Bilanço, Gelir Tablosu (Dönemsel/
// Çeyreklik/Yıllıklan.), Nakit Akış (Dönemsel/Çeyreklik/Yıllıklan.). Biz sadece Çeyreklik
// (saf tek çeyrek akım) ve Yıllıklan. (TTM — Aralık kolonu = tam yıl) sayfalarını kullanıyoruz;
// Dönemsel (yıl başından kümülatif) kullanılmıyor, ihtiyaç yok.
//
// BANKA UYARISI: Bankaların (SKBNK, GARAN, AKBNK, ISCTR, VAKBN, YKBNK, HALKB vb.) hem Gelir
// Tablosu hem Bilanço yapısı tamamen farklı (Faiz Gelirleri/Giderleri bazlı, KV/UV ayrımı yok).
// Bu Faz 1 SADECE banka-dışı şirketleri destekler — banka dosyası yüklenirse tanınır ve
// nazikçe reddedilir (aşağıda 'bank_format' hatası).
// ══════════════════════════════════════════════════════════════════════════

// Fintables tarih hücresini {y, m} olarak çözer. Format genelde "2026/6" (yıl/ay) düz metin,
// ama Excel'in kendi tarih hücresi ya da seri numarası olarak da gelebilir — hepsini kapsar.
const ftParsePeriodCell = (v) => {
  if (v === undefined || v === null || v === '') return null;
  if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1 };
  if (typeof v === 'number') {
    const d = XLSX.SSF ? XLSX.SSF.parse_date_code(v) : null;
    return d ? { y: d.y, m: d.m } : null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[\/\-](\d{1,2})$/);
  if (m) return { y: parseInt(m[1],10), m: parseInt(m[2],10) };
  m = s.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if (m) return { y: parseInt(m[2],10), m: parseInt(m[1],10) };
  return null;
};

// Gelir Tablosu / Nakit Akış kalem eşleştirmesi — düz liste, bölüm ayrımı yok.
const FT_IS_MAP = {
  'satış gelirleri':                                'revenue',
  'brüt kar (zarar)':                               'grossProfit',
  'faaliyet karı (zararı)':                         'operatingProfit',
  'ana ortaklık payları':                           'netIncome',
  'dönem karı (zararı)':                            'netIncomeTotal',
  '(esas faaliyet dışı) finansal giderler (-)':     'interestExpenseRaw',
  'amortisman':                                     'depreciationAddback',
};
const FT_CF_MAP = {
  'faaliyetlerden elde edilen nakit akışları':       'operatingCashFlow',
  'maddi ve maddi olmayan duran varlıkların alımından kaynaklanan nakit çıkışları': 'capexRaw',
};

// Bilanço'da aynı kalem adı (örn. "Ticari Alacaklar", "Finansal Borçlar") hem Dönen/Duran
// Varlıklar hem KV/UV Yükümlülükler bölümünde tekrar ediyor — bölüm bağlamı gerekiyor.
const FT_BS_SECTION_MAP = {
  'dönen varlıklar': { 'nakit ve nakit benzerleri':'cash', 'ticari alacaklar':'receivables', 'stoklar':'inventory' },
  'kısa vadeli yükümlülükler': { 'finansal borçlar':'shortTermDebt' },
  'uzun vadeli yükümlülükler': { 'finansal borçlar':'longTermDebt' },
};
// Tekil (bölüme bağlı olmayan) "Toplam ..." kalemleri
const FT_BS_GLOBAL_MAP = {
  'toplam dönen varlıklar':          'currentAssets',
  'toplam varlıklar':                'totalAssets',
  'toplam kısa vadeli yükümlülükler':'currentLiabilities',
  'toplam uzun vadeli yükümlülükler':'ltLiabilitiesTotal', // yardımcı — totalLiabilities'e toplanır
  'toplam özkaynaklar':              'equity',
  'ödenmiş sermaye':                 'sharesOutstanding', // BIST'te nominal hisse değeri 1 TL — TL tutarı = hisse adedi
};

// "Kalem" hücresini arayarak başlık satırı + etiket sütununu bulur (Fintables'ta sabit
// {r:0,c:0} değil, ama Investing.com'daki kadar oynak da değil — yine de aramak güvenli).
const ftFindHeader = (ws, range) => {
  for (let r = 0; r <= Math.min(range.e.r, 3); r++) {
    for (let c = 0; c <= Math.min(range.e.c, 3); c++) {
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      if (cell && cell.v && String(cell.v).trim().toLowerCase() === 'kalem') return { headerRow: r, labelCol: c };
    }
  }
  return { headerRow: -1, labelCol: -1 };
};

// Gelir Tablosu / Nakit Akış için düz (bölümsüz) parser. Her dönem sütunu için {y,m,values} döner.
const ftParseFlatSheet = (ws, fieldMap) => {
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const { headerRow, labelCol } = ftFindHeader(ws, range);
  if (headerRow === -1) return [];
  const periodCols = [];
  for (let c = labelCol + 1; c <= range.e.c; c++) {
    const cell = ws[XLSX.utils.encode_cell({r:headerRow, c})];
    if (!cell || cell.v === undefined || cell.v === '') continue;
    const pd = ftParsePeriodCell(cell.v);
    if (pd) periodCols.push({col:c, y:pd.y, m:pd.m});
  }
  if (!periodCols.length) return [];
  const acc = {};
  periodCols.forEach(p => { acc[p.y+'-'+p.m] = {y:p.y, m:p.m, values:{}}; });
  for (let r = headerRow+1; r <= range.e.r; r++) {
    const labelCell = ws[XLSX.utils.encode_cell({r, c:labelCol})];
    if (!labelCell || labelCell.v === undefined || labelCell.v === null || String(labelCell.v).trim() === '') continue;
    const field = fieldMap[String(labelCell.v).trim().toLowerCase()];
    if (!field) continue;
    for (const p of periodCols) {
      const cell = ws[XLSX.utils.encode_cell({r, c:p.col})];
      if (cell && cell.v !== undefined && cell.v !== '' && cell.v !== '-') {
        const n = typeof cell.v === 'number' ? cell.v : parseFloat(String(cell.v).replace(',','.'));
        if (!isNaN(n)) acc[p.y+'-'+p.m].values[field] = n;
      }
    }
  }
  return Object.values(acc);
};

// Bilanço için bölüm-farkında parser. Satır başında 4 boşluk = kalem, boşluksuz = bölüm başlığı.
const ftParseBalanceSheet = (ws) => {
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const { headerRow, labelCol } = ftFindHeader(ws, range);
  if (headerRow === -1) return [];
  const periodCols = [];
  for (let c = labelCol + 1; c <= range.e.c; c++) {
    const cell = ws[XLSX.utils.encode_cell({r:headerRow, c})];
    if (!cell || cell.v === undefined || cell.v === '') continue;
    const pd = ftParsePeriodCell(cell.v);
    if (pd) periodCols.push({col:c, y:pd.y, m:pd.m});
  }
  if (!periodCols.length) return [];
  const acc = {};
  periodCols.forEach(p => { acc[p.y+'-'+p.m] = {y:p.y, m:p.m, values:{}}; });
  let currentSection = '';
  for (let r = headerRow+1; r <= range.e.r; r++) {
    const labelCell = ws[XLSX.utils.encode_cell({r, c:labelCol})];
    if (!labelCell || labelCell.v === undefined || labelCell.v === null || String(labelCell.v) === '') continue;
    const raw = String(labelCell.v);
    if (raw.trim() === '') continue;
    const isIndented = /^\s/.test(raw);
    const norm = raw.trim().toLowerCase();
    if (!isIndented) { currentSection = norm; continue; }
    const sec = FT_BS_SECTION_MAP[currentSection];
    const field = (sec && sec[norm]) ? sec[norm] : (FT_BS_GLOBAL_MAP[norm] || null);
    if (!field) continue;
    for (const p of periodCols) {
      const cell = ws[XLSX.utils.encode_cell({r, c:p.col})];
      if (cell && cell.v !== undefined && cell.v !== '' && cell.v !== '-') {
        const n = typeof cell.v === 'number' ? cell.v : parseFloat(String(cell.v).replace(',','.'));
        if (!isNaN(n)) acc[p.y+'-'+p.m].values[field] = n;
      }
    }
  }
  return Object.values(acc);
};

// Tüm Fintables workbook'unu (7 sayfa) işleyip çeyreklik + yıllık kayıt setleri üretir.
// Dönderir: { quarterlyRecords: {"2026Q2":{...}}, annualRecords: {"2025":{...}} }
// ya da { error: 'sheets_missing' | 'bank_format' }.
const parseFintablesWorkbook = (wb) => {
  const shBS  = wb.Sheets['Bilanço'];
  const shISQ = wb.Sheets['Gelir Tablosu (Çeyreklik)'];
  const shISY = wb.Sheets['Gelir Tablosu (Yıllıklan.)'];
  const shCFQ = wb.Sheets['Nakit Akış (Çeyreklik)'];
  const shCFY = wb.Sheets['Nakit Akış (Yıllıklan.)'];
  if (!shBS || !shISQ || !shCFQ) return { error: 'sheets_missing' };

  const isQ = ftParseFlatSheet(shISQ, FT_IS_MAP);
  if (!isQ.some(r => r.values.revenue !== undefined)) return { error: 'bank_format' };
  const cfQ = ftParseFlatSheet(shCFQ, FT_CF_MAP);
  const bs  = ftParseBalanceSheet(shBS);
  const isY = shISY ? ftParseFlatSheet(shISY, FT_IS_MAP) : [];
  const cfY = shCFY ? ftParseFlatSheet(shCFY, FT_CF_MAP) : [];

  const bsByKey = {};
  bs.forEach(r => { bsByKey[r.y+'-'+r.m] = r.values; });

  const deriveRecord = (isVals, cfVals, bsVals) => {
    const rec = {};
    if (isVals.revenue != null) rec.revenue = isVals.revenue;
    if (isVals.grossProfit != null) rec.grossProfit = isVals.grossProfit;
    if (isVals.operatingProfit != null) rec.operatingProfit = isVals.operatingProfit;
    const ni = isVals.netIncome != null ? isVals.netIncome : isVals.netIncomeTotal;
    if (ni != null) rec.netIncome = ni;
    if (isVals.interestExpenseRaw != null) rec.interestExpense = Math.abs(isVals.interestExpenseRaw);
    if (isVals.operatingProfit != null && isVals.depreciationAddback != null) rec.ebitda = isVals.operatingProfit + isVals.depreciationAddback;
    if (cfVals.operatingCashFlow != null) rec.operatingCashFlow = cfVals.operatingCashFlow;
    if (cfVals.capexRaw != null) rec.capex = Math.abs(cfVals.capexRaw);
    if (bsVals) {
      ['cash','receivables','inventory','currentAssets','totalAssets','shortTermDebt','longTermDebt','currentLiabilities','equity','sharesOutstanding'].forEach(f => {
        if (bsVals[f] != null) rec[f] = bsVals[f];
      });
      if (bsVals.currentLiabilities != null && bsVals.ltLiabilitiesTotal != null) rec.totalLiabilities = bsVals.currentLiabilities + bsVals.ltLiabilitiesTotal;
    }
    return rec;
  };

  const quarterlyRecords = {};
  isQ.forEach(r => {
    const q = QUARTER_FROM_MONTH[r.m];
    if (!q) return;
    const label = r.y + 'Q' + q;
    const cfMatch = cfQ.find(x => x.y === r.y && x.m === r.m);
    quarterlyRecords[label] = deriveRecord(r.values, cfMatch ? cfMatch.values : {}, bsByKey[r.y+'-'+r.m]);
  });

  const annualRecords = {};
  isY.filter(r => r.m === 12).forEach(r => {
    const label = String(r.y);
    const cfMatch = cfY.find(x => x.y === r.y && x.m === 12);
    annualRecords[label] = deriveRecord(r.values, cfMatch ? cfMatch.values : {}, bsByKey[r.y+'-12']);
  });

  return { quarterlyRecords, annualRecords };
};

  {q:'Faaliyetlerden Sağlanan Nakit / Net Kâr oranı sürekli 1\'in çok altındaysa (ör. 0.3) bu neyi düşündürür?', opts:['Şirket vergi ödemiyor demektir', 'Muhasebe kârının önemli bir kısmı gerçek nakde dönüşmüyor olabilir', 'Şirketin hiç stoku yoktur', 'Hisse senedi ucuzdur'], correct:1, explain:'Bu oran 1\'e ne kadar yakınsa kâr o kadar "gerçek"tir. Sürekli düşük kalması, kârın büyük kısmının alacak/stok gibi nakde dönüşmeyen kalemlerde takılı kaldığını gösterir.'},

  {q:'Aktif Devir Hızı neyi ölçer?', opts:['Şirketin kaç çalışanı olduğunu', 'Şirketin elindeki varlıkları kullanarak yılda kaç kat satış ürettiğini', 'Hisse senedinin ne kadar sık el değiştirdiğini', 'Şirketin kaç şubesi olduğunu'], correct:1, explain:'Aktif Devir Hızı = Hasılat / Ortalama Varlık. Varlıkların ne kadar verimli "çalıştırıldığını", boşta yatıp yatmadığını gösterir.'},
  {q:'Stoklar satışlardan çok daha hızlı büyüyorsa (ve şirket bir GYO değilse) en olası yorum nedir?', opts:['Şirket gelecekteki talebe hazırlanıyor, bu her zaman olumludur', 'Mal elde kalıyor olabilir — talep zayıflıyor ya da fazla üretim/alım yapılmış olabilir', 'Bu durum FAVÖK\'ü otomatik artırır', 'Bu durum sadece bankaları ilgilendirir'], correct:1, explain:'Stok, satıştan hızlı büyüdüğünde depoda "para çürüyor" olabilir — ya talep beklenenden zayıf ya da üretim/alım planlaması satışın önüne geçmiş.'},
];

// ── ANA UYGULAMA ──
// ── v16: LiveModel — "Canlı 3-Tablo Modeli" eğitim bileşeni (h() formatına çevrildi) ──
function LiveModel({ data, highlightLeverKey }){
  const seed = useMemo(() => lmBuildSeed(data), [data]);
  const [inp, setInp] = useState(seed.ok ? seed.inputs : {});
  const [open, setOpen] = useState(true);
  const [last, setLast] = useState(null);
  const [hl, setHl] = useState(null);
  const [flash, setFlash] = useState({});
  const valsRef = useRef(null);

  React.useEffect(() => { if (seed.ok){ setInp(seed.inputs); setLast(null); valsRef.current = null; } }, [seed]);

  const ready = seed.ok;
  const base = ready ? seed.base : null;
  const plugs = ready ? seed.plugs : null;
  const m = ready ? lmCompute(base, inp, plugs) : null;

  React.useEffect(() => {
    if (!m) return;
    const cur = {
      is_hasilat: inp.hasilat, is_smm: -m.smm, is_brut: m.brut, is_opex: -m.opex, is_amort: -m.amort,
      is_ebit: m.ebit, is_faiz: -m.faiz, is_vok: m.vok, is_vd: -m.vergiDiger, is_netkar: m.netkar,
      cf_netkar: m.netkar, cf_amort: m.amort, cf_alacak: -inp.dAlacak, cf_stok: -inp.dStok,
      cf_diger: -inp.dDigerDonen, cf_kisaborc: inp.dKisaBorc, cf_faaliyet: m.faaliyet, cf_capex: -m.capex,
      cf_yatirim: m.yatirim, cf_uzunyuk: inp.dUzunYuk, cf_temettu: -m.temettu, cf_finansman: m.finansman,
      cf_net: m.cfNet, cf_sonuc: m.nakit_e,
      bs_nakit: m.nakit_e, bs_alacak: m.alacak_e, bs_stok: m.stok_e, bs_diger: m.digerDonen_e,
      bs_duran: m.duran_e, bs_tvar: m.varlik_e, bs_kisaborc: m.kisaBorc_e, bs_uzunyuk: m.uzunYuk_e,
      bs_ozk: m.ozk_e, bs_ozkearn: m.ozkEarn + base.ozk_o, bs_ozkother: m.ozkOther, bs_tkay: m.kaynak_e,
    };
    const prev = valsRef.current;
    valsRef.current = cur;
    if (prev) {
      const fl = {};
      for (const k in cur) if (prev[k] !== undefined && Math.round(prev[k]) !== Math.round(cur[k])) fl[k] = cur[k] > prev[k] ? 'up' : 'down';
      if (Object.keys(fl).length) { setFlash(fl); const t = setTimeout(() => setFlash({}), 850); return () => clearTimeout(t); }
    }
  });

  const C = { card: 'rgba(20, 18, 16, 0.6)', hair: 'rgba(212, 165, 116, 0.15)', gold: '#d4a574',
    t1: '#e7e5e4', t2: '#a8a29e', t3: '#78716c', green: '#4ade80', red: '#f87171' };

  const setLever = (k, v) => { const old = inp[k]; const nv = parseFloat(v); if (isNaN(nv)) return;
    setInp(s => ({ ...s, [k]: nv })); setLast({ k, d: Math.sign(nv - old) }); };

  const Lever = ({ k, label, hint, signed }) => {
    const sv = seed.inputs[k] || 0;
    let min, max;
    if (signed) { const span = Math.max(Math.abs(sv) * 3, base.scale * 0.6); min = -span; max = span; }
    else { min = 0; max = Math.max(sv * 2.5, base.scale * 0.4); }
    const step = lmNiceStep(max - min);
    const isHighlighted = highlightLeverKey === k;
    return h('div', {style:{marginBottom:'11px', padding: isHighlighted?'8px':'0',
      margin: isHighlighted?'-8px -8px 3px -8px':'0 0 11px 0',
      borderRadius:'4px',
      background: isHighlighted?'rgba(212,165,116,0.10)':'transparent',
      boxShadow: isHighlighted?'0 0 0 1.5px '+C.gold:'none',
      transition:'background 0.3s, box-shadow 0.3s'}},
      h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:'8px',marginBottom:'3px'}},
        h('label', {style:{fontSize:'12px',color:C.t1,fontWeight:500}}, label,
          h('span', {style:{display:'block',fontSize:'10px',color:C.t3,fontWeight:400,marginTop:'1px'}}, hint)
        ),
        h('input', {type:'number', value:Math.round(inp[k]), step:step,
          onChange:e=>setLever(k, e.target.value),
          style:{width:'92px',background:'rgba(10,9,8,0.6)',border:'1px solid '+C.hair,
            padding:'4px 7px',color:C.gold,fontFamily:"'JetBrains Mono',monospace",fontSize:'12px',
            outline:'none',textAlign:'right',borderRadius:'2px'}})
      ),
      h('input', {type:'range', min:min, max:max, step:step, value:inp[k],
        onChange:e=>setLever(k, e.target.value),
        style:{width:'100%',accentColor:C.gold,cursor:'pointer'}})
    );
  };

  const Line = ({ label, sub, val, fk, lk, bold, head, indent }) => {
    if (head) return h('div', {style:{fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.06em',color:C.t3,
      padding:'7px 8px 2px'}}, label);
    const flv = fk && flash[fk];
    const isHl = lk && hl === lk;
    const color = lk ? LM_LINK[lk] : (val < 0 ? C.red : C.t1);
    const bg = flv === 'up' ? 'rgba(74,222,128,0.20)' : flv === 'down' ? 'rgba(248,113,113,0.20)'
      : (isHl ? 'rgba(212,165,116,0.14)' : 'transparent');
    return h('div', {onMouseEnter:()=>lk&&setHl(lk), onMouseLeave:()=>lk&&setHl(null),
      style:{display:'grid',gridTemplateColumns:'1fr auto',gap:'10px',alignItems:'center',
        padding:'5px 8px',borderRadius:'4px',background:bg,transition:'background 0.25s',
        borderTop:bold?'1px solid '+C.hair:'none',marginTop:bold?'2px':'0',
        cursor:lk?'help':'default'}},
      h('span', {style:{fontSize:'12px',color:bold?C.t1:(indent?C.t2:C.t1),
        fontWeight:bold?600:400,paddingLeft:indent?'10px':'0'}}, label,
        sub && h('span', {style:{display:'block',fontSize:'9.5px',color:C.t3}}, sub)
      ),
      h('span', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize:'12.5px',color:color,
        fontWeight:bold?600:400,textAlign:'right'}}, lmFmt(val))
    );
  };

  const BLine = ({ label, sub, vo, ve, fk, lk, bold, head, indent }) => {
    if (head) return h('div', {style:{fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.06em',color:C.t3,
      padding:'7px 8px 2px'}}, label);
    const flv = fk && flash[fk];
    const isHl = lk && hl === lk;
    const colE = lk ? LM_LINK[lk] : (ve < 0 ? C.red : C.t1);
    const bg = flv === 'up' ? 'rgba(74,222,128,0.20)' : flv === 'down' ? 'rgba(248,113,113,0.20)'
      : (isHl ? 'rgba(212,165,116,0.14)' : 'transparent');
    return h('div', {onMouseEnter:()=>lk&&setHl(lk), onMouseLeave:()=>lk&&setHl(null),
      style:{display:'grid',gridTemplateColumns:'minmax(70px,1fr) 104px 120px',gap:'8px',alignItems:'center',
        padding:'5px 8px',borderRadius:'4px',background:bg,transition:'background 0.25s',
        borderTop:bold?'1px solid '+C.hair:'none',marginTop:bold?'2px':'0',
        cursor:lk?'help':'default'}},
      h('span', {style:{fontSize:'12px',color:bold?C.t1:(indent?C.t2:C.t1),
        fontWeight:bold?600:400,paddingLeft:indent?'10px':'0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, label,
        sub && h('span', {style:{display:'block',fontSize:'9.5px',color:C.t3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, sub)
      ),
      h('span', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize:'12.5px',color:C.t2,
        textAlign:'right',whiteSpace:'nowrap'}}, lmFmt(vo)),
      h('span', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize:'12.5px',color:colE,
        fontWeight:bold?600:400,textAlign:'right',whiteSpace:'nowrap'}}, lmFmt(ve))
    );
  };

  const cardStyle = { background: C.card, border: '1px solid ' + C.hair, borderRadius: '2px', overflow: 'hidden' };
  const cardHead = (title, sub, accent) =>
    h('div', {style:{padding:'11px 14px 9px',borderBottom:'1px solid '+C.hair,boxShadow:'inset 3px 0 0 '+accent}},
      h('div', {style:{fontFamily:"'Fraunces',serif",fontWeight:600,fontSize:'15px',color:C.t1}}, title),
      h('div', {style:{fontSize:'10px',color:C.t3,marginTop:'1px'}}, sub)
    );

  return h('div', {style:{marginTop:'16px',background:'rgba(20,18,16,0.4)',border:'1px solid '+C.hair,
    borderRadius:'2px',padding:'14px 16px'}},
    h('div', {onClick:()=>setOpen(o=>!o), style:{display:'flex',alignItems:'center',gap:'10px',
      cursor:'pointer',marginBottom:open?'12px':'0'}},
      h('span', {style:{fontFamily:"'JetBrains Mono',monospace",color:C.gold,fontSize:'14px'}}, open?'–':'+'),
      h('span', {style:{fontFamily:"'Fraunces',serif",fontWeight:600,fontSize:'18px',color:C.t1}}, 'Canlı 3-Tablo Modeli'),
      h('span', {style:{fontSize:'11px',color:C.t3}}, 'şirketin gerçek rakamlarıyla oyna — bir kalemi değiştir, dalga her yere yayılsın')
    ),

    open && !ready && h('div', {style:{padding:'16px',textAlign:'center',color:C.t2,fontSize:'13px',
      border:'1px dashed '+C.hair,borderRadius:'2px'}},
      'Canlı model için en az ', h('strong', {style:{color:'#7dd3fc'}}, '2 dönemlik'),
      ' veri gerekiyor. Çeyreklik veya Yıllık Excel yükle (üstteki butonlardan) — en az iki dönem yüklenince bu panel otomatik açılır; bir önceki dönem bu modelin başlangıç fotoğrafı olur.'
    ),

    open && ready && h('div', null,
      h('div', {style:{display:'flex',alignItems:'center',gap:'14px',flexWrap:'wrap',
        background:'rgba(74,222,128,0.07)',border:'1px solid rgba(74,222,128,0.25)',
        borderRadius:'2px',padding:'9px 14px',marginBottom:'12px'}},
        h('span', {style:{fontFamily:"'Fraunces',serif",fontSize:'15px',color:C.green,fontWeight:600}}, '● Denge'),
        h('span', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize:'12.5px',color:C.t1}},
          'Toplam varlık ' + lmFmt(m.varlik_e) + ' = Toplam kaynak ' + lmFmt(m.kaynak_e)
        ),
        h('span', {style:{fontSize:'11px',color:C.t2,marginLeft:'auto',maxWidth:'340px'}},
          'Özkaynak "varlık − borç" artığı olarak hesaplanır; bu yüzden ne yaparsan yap denge bozulmaz.'
        )
      ),

      h('div', {style:{background:'#0a0908',border:'1px solid '+C.hair,borderRadius:'2px',
        padding:'11px 15px',marginBottom:'14px',minHeight:'20px',fontSize:'13px',
        color:C.t1,lineHeight:1.5}},

// ── Rehberli Tur — LiveModel'i sarmalayıp adım adım yönlendirir; gerçek hesaplama LiveModel'de kalır ──
function RehberliTur({ data }){
  const C = EGT_C;
  const [stepIdx, setStepIdx] = useState(0);
  const step = TOUR_STEPS[stepIdx];
  const total = TOUR_STEPS.length;
  const next = () => setStepIdx(i => Math.min(total - 1, i + 1));
  const prev = () => setStepIdx(i => Math.max(0, i - 1));
  const restart = () => setStepIdx(0);

  return h('div', {style:{marginTop:'16px'}},
    h('div', {style:{background:'rgba(212,165,116,0.07)',border:'1px solid rgba(212,165,116,0.3)',borderRadius:'2px',padding:'14px 16px',marginBottom:'14px'}},
      h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'8px',flexWrap:'wrap',gap:'8px'}},
        h('div', {style:{fontFamily:"'Fraunces',serif",fontWeight:600,fontSize:'16px',color:C.gold}}, step.title),
        !step.intro && !step.outro && h('div', {style:{fontFamily:"'JetBrains Mono',monospace",fontSize:'12px',color:C.t3}}, 'Adım ' + stepIdx + ' / ' + (total-2))
      ),
      h('div', {style:{fontSize:'13px',color:C.t1,lineHeight:1.6,marginBottom:'12px'}}, step.text || step.instruction),
      h('div', {style:{display:'flex',gap:'8px',flexWrap:'wrap'}},
        h('button', {onClick:prev, disabled:stepIdx===0, style:{
          background:'transparent',border:'1px solid '+C.hair,color:stepIdx===0?C.t3:C.t1,
          padding:'6px 14px',fontFamily:"'DM Sans',sans-serif",fontSize:'12px',borderRadius:'2px',
          cursor:stepIdx===0?'default':'pointer'}}, '◀ Geri'),
        h('button', {onClick:next, disabled:stepIdx===total-1, style:{
          background: stepIdx===total-1 ? 'transparent' : C.gold, border:'1px solid '+C.gold,
          color: stepIdx===total-1 ? C.t3 : '#0a0908', fontWeight:600,
          padding:'6px 14px',fontFamily:"'DM Sans',sans-serif",fontSize:'12px',borderRadius:'2px',
          cursor:stepIdx===total-1?'default':'pointer'}}, stepIdx===total-2 ? 'Turu Bitir ▶' : 'İleri ▶'),
        stepIdx===total-1 && h('button', {onClick:restart, style:{
          background:'transparent',border:'1px solid '+C.hair,color:C.gold,
          padding:'6px 14px',fontFamily:"'DM Sans',sans-serif",fontSize:'12px',borderRadius:'2px',cursor:'pointer'}}, '↺ Baştan başla')
      )
    ),
    h(LiveModel, {data, highlightLeverKey: step.key || null})
  );
}

// ── Quiz Modu ──
function QuizModu(){
  const C = EGT_C;
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [answered, setAnswered] = useState([]);
  const total = QUIZ_SORULARI.length;
  const q = QUIZ_SORULARI[qIdx];
  const finished = qIdx >= total;

  const choose = (i) => {
    if (selected !== null) return;
    setSelected(i);
    const correct = i === q.correct;
    if (correct) setScore(s => s + 1);
    setAnswered(a => [...a, correct]);
  };
  const nextQ = () => { setSelected(null); setQIdx(i => i + 1); };
  const restart = () => { setQIdx(0); setSelected(null); setScore(0); setAnswered([]); };

  if (finished) {
    const pct = Math.round((score/total)*100);
    const verdict = pct >= 80 ? {text:'Çok iyi — temel kavramlar oturmuş.', color:C.green}
      : pct >= 50 ? {text:'Fena değil, ama bazı kavramları tekrar etmekte fayda var.', color:'#fbbf24'}
      : {text:'Sözlük ve Rehberli Tur sekmelerine bir daha göz atmanı öneririm.', color:C.red};
    return h('div', {style:{marginTop:'16px',background:'rgba(20,18,16,0.4)',border:'1px solid '+C.hair,borderRadius:'2px',padding:'24px',textAlign:'center'}},
      h('div', {style:{fontFamily:"'Fraunces',serif",fontSize:'22px',fontWeight:600,color:C.t1,marginBottom:'6px'}}, 'Sonuç: ' + score + ' / ' + total),
      h('div', {style:{fontSize:'14px',color:verdict.color,marginBottom:'16px'}}, verdict.text),
      h('button', {onClick:restart, style:{background:C.gold,border:'none',color:'#0a0908',fontWeight:600,
        padding:'8px 20px',fontFamily:"'DM Sans',sans-serif",fontSize:'13px',borderRadius:'2px',cursor:'pointer'}}, '↺ Baştan Başla')
    );
  }

  return h('div', {style:{marginTop:'16px',background:'rgba(20,18,16,0.4)',border:'1px solid '+C.hair,borderRadius:'2px',padding:'18px 20px'}},
    h('div', {style:{display:'flex',justifyContent:'space-between',fontSize:'11px',color:C.t3,marginBottom:'10px'}},
      h('span', null, 'Soru ' + (qIdx+1) + ' / ' + total),
      h('span', null, 'Skor: ' + score)
    ),
    h('div', {style:{fontSize:'15px',color:C.t1,marginBottom:'14px',lineHeight:1.5,fontWeight:500}}, q.q),
    h('div', {style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom: selected!==null ? '14px' : '0'}},
      q.opts.map((opt,i) => {
        let bg = 'rgba(10,9,8,0.4)', border = C.hair, color = C.t1;
        if (selected !== null) {
          if (i === q.correct) { bg = 'rgba(74,222,128,0.14)'; border = C.green; color = C.green; }
          else if (i === selected) { bg = 'rgba(248,113,113,0.14)'; border = C.red; color = C.red; }
        }
        return h('div', {key:i, onClick:()=>choose(i), style:{
          background:bg, border:'1px solid '+border, borderRadius:'2px', padding:'10px 14px',
          fontSize:'13px', color:color, cursor: selected===null?'pointer':'default', lineHeight:1.4
        }}, opt);
      })
    ),
    selected !== null && h('div', {style:{fontSize:'12px',color:C.t2,lineHeight:1.6,padding:'10px 12px',
      background:'rgba(212,165,116,0.06)',borderLeft:'3px solid '+C.gold,borderRadius:'0 2px 2px 0',marginBottom:'14px'}}, q.explain),
    selected !== null && h('button', {onClick:nextQ, style:{background:C.gold,border:'none',color:'#0a0908',fontWeight:600,
      padding:'7px 18px',fontFamily:"'DM Sans',sans-serif",fontSize:'12px',borderRadius:'2px',cursor:'pointer'}},
      qIdx === total-1 ? 'Sonucu Gör ▶' : 'Sonraki Soru ▶')
  );
}
